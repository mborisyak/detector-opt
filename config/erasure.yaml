# RUN config for the `erasure` task: EMNIST digit classification through random pixel erasure.
#
# WHAT BO IS MINIMISING. The trained loss is the 10-class cross-entropy in nats alone -- that, and
# only that, is what the convergence criterion judges. scripts/bo.py then ADDS the detector's
# design_penalty, ln(10) times the keep probability, so the objective is
#
#     cross_entropy + ln(10) * p
#
# p = 1 pays ln(10) in price and near-0 in cross-entropy; the floor pays almost nothing in price and,
# if the range is right, about ln(10) in cross-entropy. The optimum is the smallest share of the ink
# that still identifies the digit, and a total above ln(10) means the design is worse than useless.
# results.json keeps trained_loss and design_penalty beside the summed loss.
#
# THE DESIGN IS ONE COORDINATE, log-scaled: p = min_keep^(1-u), so u = 0 is the floor and u = 1 is a
# complete frame. Log rather than linear because the surviving ink spans decades over this range.
#
# regressor -- alpha-conv-regressor over the dense (28, 28, 2) frame: the surviving pixels on [0, 1]
#   beside a constant plane holding the scaled keep probability. The network must be told p, because
#   an erased pixel is indistinguishable from background and only the design says how much ink is
#   missing. At channels [16, 24, 32] with 2 blocks it is 44754 parameters over a 2-channel input.
#
# training.budget -- 240000, THE DATASET SIZE. The run's event stream is one seeded permutation of
#   [0, size) consumed sequentially and designs take disjoint consecutive slices, so at budget ==
#   size every design trains on frames no other design has seen and nothing is ever repeated. One
#   call above it and shuffled_event_index wraps and starts re-issuing frames; check any run log for
#   the string "oversampling", which is the symptom.
#
# training.iteration_limit -- 32768, ALSO THE EPOCH LENGTH: steps_per_epoch = iteration_limit //
#   batch, so 256-step epochs. That coupling is definitional and must not be broken -- warmup_epochs,
#   patience and the convergence posterior are all in epoch units. A short epoch is what once let the
#   procedure exit while the network was still sitting on the class prior, with the training curve
#   flat only because nothing had happened yet.
#
# training.loss_precision -- ⚠️ 2.0e-1 IS A PLACEHOLDER, NOT A MEASUREMENT. The landscape probe runs
#   at a deliberately loose trial bar and reports the worst diff + err actually reached; this value
#   must be replaced by that measurement plus a margin before a campaign is run. Nothing here is
#   inherited from the deleted Poisson exposure task.
#
# bo.gp.kernel -- ard-rbf over the single coordinate; no set symmetry in one dimension.

detector: emnist_digits_erasure

regressor:
  alpha-conv-regressor:
    channels: [16, 24, 32]
    blocks: 2
    kernel_size: 3
    p_dropout: null

device: cuda
plot_per_epoch: 8

training:
  n0: 8192
  n_increment: 4096
  batch: 128
  eval_batch: 2048
  warmup_epochs: 2
  patience: 8
  budget: 240000
  iteration_limit: 32768
  val_fraction: 0.25
  loss_precision: 2.0e-1
  param_mix: 0.25
  optimizer:
    adamaxw:
      learning_rate: 5.0e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      ard-rbf: {}
  ei:
    n_restarts: 32
    n_steps: 100

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
