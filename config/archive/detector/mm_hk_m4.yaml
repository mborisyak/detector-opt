# Michaelis-Menten hexokinase depletion cell, m = 4 experiments per design.
#
#     dA/dt = -q A / (A + K),   A(0) = A0
#
# Design = the m initial concentrations A0 (mM); target = (ln q, ln K). Times are seconds, so q is
# mM/s and K is mM. Priors, window and read-out count are shared with the m = 2 cell; the two cells
# differ in `n_experiments`, `measurement_noise` and the box floor tied to it.
#
# The box floor was re-derived on 2026-08-20 by the same rule as the m = 2 cell. Neither the ceiling
# nor `n_grid` transfers from it: both were measured on this cell and rejected. See
# docs/decision-log.md (D169).
enzyme_depletion:
  n_experiments: 4
  n_measurements: 8
  duration: 7200.0
  michaelis_bounds: [0.02, 0.2]
  velocity_bounds: [3.0e-5, 3.0e-4]
  concentration_bounds: [0.025, 0.8]
  measurement_noise: 0.0125
  n_stages: 5
  steps_per_measurement: 64
  damping: 0.15384615384615385
  integration_tolerance: 1.25e-3
  n_grid: 65
