# Full config for the `enzyme_inhib` detector (EnzymeInhibitorDetector): EVERY __init__ parameter.
# Single-batch design of experiments on a hexokinase INHIBITOR: glucose (A) + ATP (B) -> G6P (C) +
# ADP (D), with a compound `I` that is a design coordinate. The target is the compound's MECHANISM
# CLASS (mostly-competitive / mostly-noncompetitive / mostly-uncompetitive), scored by softmax
# cross-entropy / ln 3. Concentrations are mM, times hours, temperatures degrees Celsius.
#
# EVERY entry below cites a measurement or is labelled ESTIMATE with its reasoning; every design
# bound states the RULE that produced it, using ONLY the prior and the read-out noise floor. The
# full declaration is output/screen/provenance-inhibitor.md (the gate of
# output/agent-docs/benchmark-acceptance.md 1.1); the plan is
# output/agent-docs/task-inhibitor-mechanism.md.
enzyme_inhib:
  # STRUCTURAL, not a knob: one experiment per cell of the 2x2 factorial the physics implies --
  # (B0 low / B0 saturating) x (I weak / I ~ 1/k). Each cell identifies a different quantity: K_B,
  # k_cat, k1 (competitive, visible only below K_B) and k2 (uncompetitive, visible at saturation),
  # and neither arm can be read without the other to calibrate where B0 sits relative to K_B. The
  # screen also reports m = 2 and m = 3, which is where a smaller batch would show if it were
  # preferable.
  n_experiments: 4    # the designed batch: BO searches 4 * n_experiments dimensions
  # BASELINE, unchanged (plan section 12: `duration` and `n_measurements` stay at baseline).
  n_measurements: 8   # [A] read-outs per experiment, evenly spaced, the last at `duration`

  # NO MIXING CONSTRAINT (waived by the user, 2026-08-12). Every initial concentration below is an
  # INDEPENDENT coordinate: the baseline detector's volume budget (enzyme stock takes a fraction, A
  # and B split the rest) is bookkeeping rather than physics, because stocks can be made up at
  # whatever strength an experiment needs. What stays physical is each coordinate's own limit --
  # solubility at the top, the read-out noise floor at the bottom for the MEASURED species, the
  # min(A0, B0) cap on total conversion for the co-substrate, and pipetting practicality for the
  # enzyme dilution -- and those are the rules each bound is stated from.
  #
  # Glucose, held FIXED and saturating for every experiment, so it neither confounds the substrate
  # contrast nor spends a design dimension. RULE: 2.5x the top of the K_M(glucose) prior (0.02-0.2
  # mM, measured -- yeast HK 0.14 +- 0.002 mM) and 10x the 0.05 mM read-out noise, so the conversion
  # of A is the read-out's full scale. It is the MEASURED species, hence the noise-floor rule.
  concentration_A: 0.5
  # The ATP concentration of the TURNOVER CALIBRATION mixture (not an experiment). RULE: the
  # geometric centre of the ATP design box [0.1, 10] and at the top of the K_M(ATP) prior [0.1, 1],
  # so the turnover reference is a saturated-ATP one. Physiological ATP is 1-5 mM, so it is also a
  # real assay concentration.
  concentration_B: 1.0
  # BASELINE, unchanged. The E stock is set so the CALIBRATED turnover lands in the hexokinase band:
  # MEASURED here, the calibrated k_cat comes out at a median 30.9 /s (10-90% 8.9-136 /s) against a
  # literature hexokinase 30-300 /s -- a falsifiable realism check on the stock, the reference
  # mixture and the half-time prior together.
  concentration_E: 3.0e-5

  duration: 1.0            # BASELINE, unchanged: one experiment lasts an hour
  # BASELINE, unchanged, and set ONCE before any landscape was measured. It is an ABSOLUTE std on
  # [A], as a spectrophotometric assay is. The plan permits lowering it as a stated instrument change
  # (a fluorescence- or NADH-coupled read-out really does resolve more, and the detection floor
  # scales linearly with it) but requires it be set once and never adjusted afterwards, because it is
  # a difficulty knob: lowering it makes every design more informative. It is left at the baseline
  # and the ATP site is used -- exactly the site whose sub-K_M arm clears this floor.
  measurement_noise: 0.05

  # ------------------------------------------------------------------------------------------------
  # DESIGN BOUNDS -- each states the RULE that produced it, using only the prior and the noise floor.
  # ------------------------------------------------------------------------------------------------
  # The enzyme's own axis: the dilution factor applied to the enzyme stock, which (no mixing
  # constraint) dilutes nothing else. It is kept as an axis because k_cat and E0 enter the rate only
  # as a PRODUCT, so varying the enzyme dose is what separates them. RULE: PIPETTING PRACTICALITY --
  # a one-decade dilution series is what a bench dilution row is. 0 is excluded because "no enzyme"
  # is not an experiment -- it carries exactly no information at any (B0, I), the same reason I = 0
  # is excluded. The top is 0.9 rather than 1.0 so the FASTEST enzyme in the half-time prior (0.25 h
  # at the calibration dose 0.5) still needs 0.25 * 0.5/0.9 = 0.14 h to half conversion, i.e. is not
  # already finished at the first read-out (duration/8 = 0.125 h).
  enzyme_fraction_bounds: [0.1, 0.9]
  # ATP: THE VARIED SUBSTRATE, an independent concentration. RULE: 0.1x .. 10x the K_M(ATP) prior
  # [0.1, 1] mM, with the FLOOR RAISED BY THE CONVERSION CAP -- total conversion is capped by
  # min(A0, B0), so at B0 = 0.01 mM (0.1x of the prior floor) the whole curve would be a fifth of one
  # noise sigma tall. The floor therefore sits at 0.1 mM, where the maximum conversion is 2 sigma and
  # ~5.7 SEM over the 8 read-outs. The ceiling 10 mM is 10x the top of the prior, i.e. saturating for
  # every enzyme in it, and well inside ATP's solubility (physiological ATP is 1-5 mM).
  # LOG-scaled into [0, 1] (see the note at the end of this file).
  substrate_B_bounds: [0.1, 10.0]
  # The inhibitor, an independent concentration. RULE: straddles the WHOLE Ki prior [1e-3, 1] mM, so
  # a design can bracket any compound in the library; 1 mM is also an unremarkable strength for a
  # small-molecule stock, i.e. inside solubility. STRICTLY POSITIVE -- no I = 0 anywhere, which is
  # what removes the exact ceiling: information is nonzero for every I > 0, so the ceiling is
  # approached asymptotically instead of hit (the melting-point benchmark's dead volume was exactly
  # the opposite). LOG-scaled.
  inhibitor_bounds: [1.0e-3, 1.0]
  # RULE: a standard bench range whose upper edge sits ~7 C BELOW the ~41.9 C melting point of yeast
  # hexokinase (which inactivates dissociatively over 40-47 C), so no experiment in the box is a
  # denaturation probe and no unfolding has to be simulated; the lower edge is the coldest a
  # thermostatted assay is routinely run at. Still a real lever: at Q10_B up to 2.0 it moves K_B by
  # 5.7x across the box, hence where a fixed B0 sits relative to it. LINEAR (an order-1 range).
  temperature_bounds: [10.0, 35.0]

  # ------------------------------------------------------------------------------------------------
  # THE COMPOUND LIBRARY -- the prior the mechanism class is drawn from.
  # ------------------------------------------------------------------------------------------------
  # Ki (mM) of the DOMINANT branch, log-uniform; k = 1/Ki is what enters the rate law. MEASURED
  # anchors, all real hexokinase inhibitors: lonidamine Ki 2.5 uM (non-competitive/mixed) at the
  # potent end, mannoheptulose ~10-100 uM, trehalose-6-phosphate uM scale, 2-deoxyglucose ~0.1 mM,
  # weak screening hits at the mM end. 3-bromopyruvate (Ki 2.4 mM) is deliberately EXCLUDED --
  # covalent/irreversible, which this rate law cannot describe. The two ends are fixed by two
  # arguments that agree, which is the check that the prior was not chosen for convenience: these
  # anchors, and independently the detection-limit rule (a compound whose Ki lies outside the
  # inhibitor design box cannot be bracketed by any design, so the prior and the box share their
  # ends).
  inhibitor_potency_bounds: [1.0e-3, 1.0]
  # |d| = |log10(k1/k2)|, the preference between the free enzyme and the ES complex.
  # ESTIMATE from reporting practice: a compound is called competitive or uncompetitive when one
  # branch dominates by about a decade or more (10x .. 300x here) ...
  preference_bounds: [1.0, 2.5]
  # ... and noncompetitive when the two affinities are equal in practice (within 1.4x).
  preference_bounds_noncompetitive: [0.0, 0.15]
  # THE BAND 0.15 < |d| < 1.0 IS NOT SAMPLED (enforced in __init__). Those compounds are genuinely
  # "mixed" and no enzymologist would assign them a class, so excluding them matches reporting
  # practice rather than being a convenience: without the gap the Bayes error would be dominated by
  # boundary-ambiguous compounds -- a floor NO design can reduce, which is exactly the
  # design-independent floor this benchmark must avoid.

  # ------------------------------------------------------------------------------------------------
  # TURNOVER CALIBRATION -- `log_k0_cat` is the one kinetic parameter NOT drawn.
  # ------------------------------------------------------------------------------------------------
  # Every drawn enzyme is rescaled so that the reference mixture (glucose 0.5 mM, ATP
  # `concentration_B`, enzyme stock at `calibration_fraction`, NO compound), at its own fastest
  # temperature, reaches half conversion at a time drawn log-uniformly from `half_time_bounds`.
  # Turnover enters the rate as a single multiplicative factor, so this is an exact rescaling of
  # every timescale. The compound is absent from the calibration, so the label cannot leak into the
  # timescale.
  calibration_fraction: 0.5   # ESTIMATE: the midpoint of the enzyme_fraction box, i.e. the typical dose
  # ESTIMATE (baseline, unchanged): the band an hour-long batch assay can measure at all -- an enzyme
  # at 0.25 h is 4 half-conversions deep by the last read-out, one at 2 h has moved a quarter of the
  # way. Turnover is CALIBRATED to it, not drawn, so no enzyme is either finished or untouched.
  half_time_bounds: [0.25, 2.0]

  # ------------------------------------------------------------------------------------------------
  # THE ENZYME PRIOR -- an UNKNOWN HEXOKINASE VARIANT. Identical to the baseline `enzyme` config
  # except that the three thermal-unfolding parameters are GONE: the temperature box sits below the
  # melt of a real hexokinase, where the folded fraction moves by ~4% across the whole box (measured,
  # under the read-out noise, monotone in T and absorbed by the turnover calibration), so simulating
  # it would add three ESTIMATE thermodynamic parameters that change nothing measurable. Ranges are
  # the approximate literature spread across isoforms and species (HK I/II/III, yeast), NOT one
  # isoform; every parameter is drawn uniformly within its range, so a `log_*` range is log-uniform
  # on the quantity itself. Reported K_M(glucose), K_M(ATP) and Ki(G6P) span three orders of
  # magnitude across isozymes and conditions (free Mg2+ especially), so a wide prior is backed by the
  # real dispersion of the literature rather than chosen for convenience.
  # ------------------------------------------------------------------------------------------------
  parameters:
    log_K0_A: [-3.91, -1.61]  # MEASURED. K_M glucose 0.02 .. 0.2 mM: yeast HK 0.14 +- 0.002 mM, ~50 uM
                              # by initial-velocity kinetics, HK I/II 0.03-0.05 mM
    Q10_A: [0.7, 2.0]         # ESTIMATE: a Michaelis constant drifts only mildly with temperature, so
                              # the per-10C factor brackets 1 by about 2x either way
    log_K0_B: [-2.30, 0.0]    # MEASURED. K_M ATP 0.1 .. 1 mM: yeast HK 0.27 +- 0.02 mM
    Q10_B: [0.7, 2.0]         # ESTIMATE, as Q10_A
    log_K0i_C: [-3.91, -1.61] # MEASURED. Ki of the product G6P, 0.02 .. 0.2 mM: 65 uM, competing with
                              # ATP at the active site. NOTE the functional form: this model makes the
                              # product inhibition competitive on GLUCOSE, a simplification inherited
                              # from the baseline; the constant is the real one
    Q10_C: [0.7, 2.0]         # ESTIMATE, as Q10_A
    log_K0i_D: [-1.20, 1.10]  # MEASURED. Ki of the product ADP, 0.3 .. 3 mM: Kis 0.86, Kii 1.0, Kid 1.9 mM
    Q10_D: [0.7, 2.0]         # ESTIMATE, as Q10_A
    Q10_cat: [1.8, 2.6]       # MEASURED (typical): enzymic Q10 2-3, Ea 50-100 kJ/mol; this range is
                              # Ea 40-60 kJ/mol, i.e. mildly conservative

  # ------------------------------------------------------------------------------------------------
  # Numerics: the resolution of each numerical procedure. None of these change the physics -- they
  # decide how accurately it is computed. The rate law here differs from the baseline's, so both the
  # step and the tolerance are RE-MEASURED rather than inherited (scripts/validate_inhibitor.py).
  # ------------------------------------------------------------------------------------------------
  # Golden-section contractions locating the calibration's fastest temperature. Each contraction is
  # ONE quadrature (no time stepping) and shrinks the bracket by 0.618, so 20 take the 25 C box to
  # 25 * 0.618^20 = 0.0017 C.
  n_temperature_steps: 20
  # Trapezoid nodes for the calibration's tau(T) = int_0^x_half dx/rate. The calibration is a
  # quadrature over the EXTENT, not a time integration, so this is its only resolution knob.
  n_quadrature: 33
  # RKC2 steps per read-out interval: 8 * 80 = 640 steps per experiment, dt = 1/640 h = 5.6 s.
  # MEASURED at these settings (scripts/validate_inhibitor.py, NOT inherited -- the rate law changed):
  # worst |df/dx| = 1193 /h over 512 prior draws x all 16 box corners, so z = dt |df/dx| = 1.86
  # against the measured float32 RKC2 stability boundary 16.60 at 5 stages, an 8.9x margin. The
  # dt-vs-dt/2 disagreement at the read-out times is 1.24e-4 mM, 40x inside the tolerance below and
  # 402x below the read-out noise.
  n_steps_per_measurement: 80
  # RKC2 stages per step: the scheme spends s rate evaluations to push a damped Chebyshev polynomial
  # along the negative real axis, so its stability boundary grows like s^2 instead of Euler's fixed 2
  # (measured z = 16.60 at s = 5). float32 gives out at s = 10, where roundoff in the recursion
  # leaves no stable interval at all.
  n_stages: 5
  # Verwer's damping epsilon = 2/13. It lifts |R(z)| off 1 between the polynomial's extrema, turning
  # the bare Chebyshev scheme's tangency into a strip of genuine stability.
  damping: 0.153846
  # Guard threshold, in mM, on the error the solve estimates for ITSELF: every integration runs a dt
  # and a dt/2 chain and reports max|fine - coarse| at the read-out times, and __call__ raises if that
  # exceeds this, host-side, on every call. RULE (repo-wide): 10% of `measurement_noise` -- the
  # integration must not disturb what the read-out itself resolves.
  integration_tolerance: 5.0e-3

# WHY THE TWO CONCENTRATION KNOBS ARE LOG-SCALED (design coordinates only; the MEASUREMENTS stay
# linear). The response depends on log(B0/K_B) and log(I*k), so the objective is smooth in log
# concentration and violently curved in linear concentration -- exactly the coordinate a stationary
# GP kernel needs. Under a linear map 90% of the unit cube would sit in the top decade and the
# informative sub-K_M arm would be compressed into a sliver, re-creating "most of the box is
# uninformative" as an ENCODING artefact having just removed it from the chemistry. The read-outs are
# kept LINEAR because the noise is additive and homoscedastic there, and a noisy [A] near zero can be
# negative, where a log is undefined.
