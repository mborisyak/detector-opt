# Michaelis-Menten hexokinase depletion cell, m = 2 experiments per design.
#
#     dA/dt = -q A / (A + K),   A(0) = A0
#
# Design = the m initial concentrations A0 (mM); target = (ln q, ln K). Times are seconds, so q is
# mM/s and K is mM. Priors, window and read-out count are shared with the m = 4 cell; the two cells
# differ in `n_experiments`, `measurement_noise` and the box floor tied to it.
#
# `concentration_bounds` and `n_grid` were re-derived on 2026-08-20; the box rule, the estimator
# convergence check and the cost to the doubling criterion are recorded in docs/decision-log.md
# (D169). `n_grid` is read only by the analytic estimator, never by the trainer.
enzyme_depletion:
  n_experiments: 2
  n_measurements: 8
  duration: 7200.0
  michaelis_bounds: [0.02, 0.2]
  velocity_bounds: [3.0e-5, 3.0e-4]
  concentration_bounds: [0.00625, 1.6]
  measurement_noise: 0.003125
  n_stages: 5
  steps_per_measurement: 64
  damping: 0.15384615384615385
  integration_tolerance: 3.125e-4
  n_grid: 257
