# CAMPAIGN CONFIG -- the `extremes` task CONTINUED at 1.5x the detector-call budget.
#
# It is not a new experiment. It is `config/enzyme_extremes.yaml` with ONE value changed, run on a
# COPY of that campaign's finished tree, so every design already measured is kept and the extra
# budget buys more designs on the same runs:
#
#   training.budget   2097152 -> 3145728   (1.5x; 3 * 2^20)
#
# Everything else is identical -- the seeds, the network, the growth schedule, `loss_precision`,
# `iteration_limit`, every trainer default. Read enzyme_extremes.yaml for what each rests on.
#
# ⚠️ `iteration_limit` STAYS AT 524288 AND MUST. It is also the EPOCH LENGTH
# (`steps_per_epoch = iteration_limit // batch`), and `warmup_epochs`, `patience` and the convergence
# posterior are all written in epoch units. Raising it with the budget -- the `budget/4` rule of thumb
# would give 786432 -- would silently retune the convergence procedure PART WAY THROUGH each run, so
# designs before and after the extension would be scored under different stopping behaviour. The
# procedure is fixed and is not ours to retune; the budget is the only lever here.
#
# HOW THE CONTINUATION WORKS, and why it needs the resume changes made alongside it:
#
#   * `results.json` is the trajectory and is never a workflow output, so nothing deletes it; the
#     workflow's `done.txt` marker is what says "finished". Removing `done.txt` in the copy reopens
#     each run exactly where it stopped. Removing `verified.txt` re-runs the re-scoring against the
#     longer trajectory, which is the point of invalidating verification.
#   * `Pool.load` now takes the trainer's CONFIGURED capacity, so the raised budget actually enlarges
#     the pools. Taking capacity from the restored arrays -- as it did -- silently discarded the
#     raise and each run ended on its first round having added nothing.
#   * The event index is a list of (train, val) GENERATIONS rather than one cut at `train_budget`.
#     The cut MOVES when the budget changes, and the resumed training pool would then refill from
#     exactly the stream positions the validation pool already holds: measured at this very change,
#     2097152 -> 3145728, that is 524225 of the 524288 stored validation events reappearing as
#     training data. With generations the increment is a fresh block and the overlap falls to 192,
#     which is the background rate of an analytic source drawing with replacement from [0, 2**31).
#
# WHAT THIS CAN AND CANNOT BE COMPARED WITH. Against the parent campaign it is a clean single-
# variable comparison in the budget, on the SAME seeds and the SAME early designs -- the trajectories
# share a prefix by construction, so it answers "what do more designs buy" rather than "is this
# configuration better". It is NOT independent of the parent: the two share every design up to the
# original budget, so they must never be pooled or treated as separate samples.

#
# 2026-08-18 -- regressor.dropconnect SET TO 0.0 (user). MEASURED on `linear`, 72 crossed cells: it
# adds BIAS THE CRITERION CANNOT SEE -- held-out excess rises to +0.00479 at dose 0.2 (48% of the bar)
# while `gap` FALLS and the exit window is unchanged (ratio 1.00), so no extra data is bought in
# compensation. `meta` is hurt about half as much, so replay is partly redundant with it.
#
# ⚠️ THE CLAIM THIS OVERRIDES -- NOW TESTED AND REFUTED. The block below records "UNREGULARISED, the
# network converges 0 of 3 -- its persistent train/validation gap is 0.0096-0.0129, above the bar".
# That was measured at `iteration_limit` 131072 with 512-step epochs (D93). MEASURED 2026-08-18 at
# THIS config's 524288 with 2048-step epochs, 3 designs x 2 arms on `bo` (jobs 36/37, output in
# `output/extremes-nodc/`): 6 of 6 CONVERGED, 0 capped, gap 0.0047-0.0069 -- not 0.0096-0.0129 -- with
# `gap + err` at 0.0093-0.0099 against the 0.010 bar. The gap is NOT persistent; it had not finished
# falling when the old cap bit. Five of the six needed 172k-250k rows, MORE than the old 131072 limit,
# so every one would have been scored "does not converge" under it.
#
# ⚠️ THE COST IS REAL: median 278512 calls per design against the ~98281 recorded at dropconnect 0.1,
# i.e. 2.8x. On `budget` 2097152 that is ~7-8 designs a run instead of ~21, BELOW what the n -> 2n
# acceptance criterion needs. Running this task unregularised requires the budget raised roughly 3x;
# leaving the budget unchanged silently shortens every run.

#
# 2026-08-18 (later) -- dropconnect 0.05, NOT null. Reverted from the `null` set earlier the same day.
#
# TURNING IT OFF REMOVED THE TERMINATION MECHANISM FROM BOTH PROCEDURES, which the bias measurement
# did not anticipate:
#   growth  -- the gap gate `gap + err <= loss_precision` needs the gap held down; unregularised the
#              config's own record says designs cap (later shown to be an artefact of a 131072 cap,
#              but the cost is real: 278512 calls/design against ~98281, i.e. 2.8x).
#   fixed   -- stops on the TRAIN-SETTLED test alone, so the only thing that can end a design is the
#              training curve flattening. MEASURED: with dropconnect 0.1, 394 of 394 designs
#              terminated, median 109 s, max 271 s. With dropconnect null, median 476 s, max 2919 s,
#              and designs still running past 3500 epochs with validation rising since epoch 600.
#
# 0.05 RATHER THAN 0.1 because that is where the bias is negligible. MEASURED on `linear`, 72 crossed
# cells, held-out excess against the closed-form floor, paired within (design, seed):
#     dose    from_scratch   meta
#     0.05      +0.00007    +0.00001
#     0.10      +0.00110    +0.00050
#     0.20      +0.00479    +0.00262
# and this task's own earlier record puts 0.05 at -0.0004 on the objective, i.e. free. 0.05 therefore
# buys termination at a bias two orders of magnitude below the dose that motivated turning it off.

detector: enzyme_extremes

regressor:
  set-regressor:
    features: [[24, 16], [16, 24]]
    n_models: 4
    dropconnect: 0.05
device: cuda
plot_per_epoch: 8

training:
  n0: 8192
  n_increment: 4096
  batch: 256
  eval_batch: 2048
  warmup_epochs: 2
  patience: 16
  budget: 3145728
  iteration_limit: 524288
  val_fraction: 0.25
  loss_precision: 1.0e-2
  param_mix: 0.25
  optimizer:
    adamaxw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      normalised-invariant-rbf:
        exchangeable: 4
  ei:
    n_restarts: 32
    n_steps: 100

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
