# RUN config for the `pixel_density` task: EMNIST digit classification from a 10x10 sampling grid
# whose point density is the design.
#
# WHAT BO IS MINIMISING. The 10-class cross-entropy in nats, and NOTHING ELSE -- `design_penalty`
# returns None here, so scripts/bo.py adds no term at all and records `design_penalty: null` beside
# a `loss` that is the trained loss itself. There is no price to pay because the sample budget is
# already fixed at n_grid^2 = 100: the design cannot buy resolution, it can only decide where the
# hundred points go, and the trade-off is intrinsic. ln(10) = 2.302585 is the no-information
# reference a uniform prediction scores; a design at that level has told the network nothing.
#
# THE DESIGN IS TWO COORDINATES, (sigma_x, sigma_y), log-scaled over [0.2, 5.0] so SCALED 0.5 is
# sigma = 1, the uniform grid. Below 1 the samples crowd the centre (fine on the middle of the digit,
# blind to its extremities); above 1 they pile onto the borders (full coverage, but strokes fall
# between samples). See config/detector/pixel_density.yaml for what each end measures.
#
# regressor -- alpha-conv-regressor over the dense (10, 10, 3) read-out: the sampled field beside two
#   constant planes holding the scaled sigma_x and sigma_y. The design planes are not optional -- the
#   grid's spacing is not uniform and nothing else tells the network how the plane was warped. The
#   image is 10x10, so the stack runs 10 -> 5 -> 3 and a third stride would pool almost nothing;
#   channels [16, 24, 32] with 2 blocks is 44898 parameters over a 3-channel input.
#
# training.budget -- 240000, THE DATASET SIZE. The run's event stream is one seeded permutation of
#   [0, size) consumed sequentially and designs take disjoint consecutive slices, so at budget ==
#   size every design trains on frames no other design has seen and nothing is ever repeated. One
#   call above it and shuffled_event_index wraps and starts re-issuing frames; check any run log for
#   the string "oversampling", which is the symptom. Verified at the helper: 240000 draws are 240000
#   distinct indices with no warning, 240001 warns and wraps.
#
#   WHAT IT BUYS, measured rather than carried over: every one of the 14 cells in
#   output/pixel-density/precision.json converged at n0 with no growth round, spending exactly 10923
#   detector calls (8192 train + 2731 validation). A run therefore scores 21 designs -- `n_init` = 5
#   draws and ~16 BO-guided -- and the 22nd exhausts the pool. Median wall clock was 22.3 s per
#   design on one GPU shard with 2 CPUs (876 s for the same design on 2 CPU cores, no GPU), so a
#   21-design run is of the order of ten minutes of shard time plus the GP/EI overhead. Enough to
#   compare arms; size any campaign from these numbers rather than from another task's.
#
# training.iteration_limit -- 32768, ALSO THE EPOCH LENGTH: steps_per_epoch = iteration_limit //
#   batch, so 256-step epochs. That coupling is definitional and must not be broken -- warmup_epochs,
#   patience and the convergence posterior are all in epoch units.
#
# ⚠️ WHAT IS INHERITED FROM THE SIBLING EMNIST TASKS AND HAS *NOT* BEEN MEASURED HERE: `n0`,
#   `n_increment`, `batch`, `eval_batch`, `warmup_epochs`, `patience`, `iteration_limit` and the
#   optimizer block, all taken from config/erasure.yaml and config/emnist.yaml, and `param_mix`,
#   `weight_decay` and the ensemble/dropout choices, which are the repo's settled trainer defaults.
#   The read-out here is 100 interpolated values rather than 784 pixels (the network is the same size,
#   44898 parameters against 44754, but it sees a 300-value input instead of a 1568-value one), so the
#   per-design cost and the convergence bar may both move; treat every number in this block as
#   inherited until a screen on THIS task says otherwise.
#
# training.loss_precision -- 2.5e-1, MEASURED on this task and inherited from nothing.
#   scripts/probe_precision.py scored 7 designs (the centre, both box corners and four Sobol draws)
#   x 2 seeds at the settings above; output/pixel-density/precision.json holds every cell. All 14
#   converged, none hit the window cap, and the worst `diff + err` reached was 0.1769 at the
#   sigma = (0.2, 0.2) corner, against a median of 0.0842. The binding term there is `diff` = 0.1516,
#   the train/validation gap, which is an overfitting bias and does NOT fall with more data -- so no
#   bar below about 0.18 is reachable for that design however long it trains. 2.5e-1 is the worst
#   measured value with ~40% of margin above it.
#
#   ⚠️ Every cell is CENSORED at the 2.0e-1 the measurement itself ran at: it proves each design can
#   reach that value, not where its floor is. Re-measure if the network, the optimizer or
#   `iteration_limit` changes, and check any campaign log for a design that failed to converge.
#
# bo.gp.kernel -- ard-rbf over the two coordinates. NO symmetry is declared: sigma_x and sigma_y are
#   not exchangeable, a digit not being invariant under transposing the frame.

detector: pixel_density

regressor:
  alpha-conv-regressor:
    channels: [16, 24, 32]
    blocks: 2
    kernel_size: 3
    p_dropout: null

device: cuda
plot_per_epoch: 8

training:
  n0: 8192
  n_increment: 4096
  batch: 128
  eval_batch: 2048
  warmup_epochs: 2
  patience: 8
  budget: 240000
  iteration_limit: 32768
  val_fraction: 0.25
  loss_precision: 2.5e-1
  param_mix: 0.25
  optimizer:
    adamaxw:
      learning_rate: 5.0e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      ard-rbf: {}
  ei:
    n_restarts: 32
    n_steps: 100

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
