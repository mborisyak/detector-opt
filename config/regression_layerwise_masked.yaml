detector: stereo_layerwise

plot_per_epoch: 8
design: initial_stereo

regressor:
  masked-set-regressor:
    features: [ [ 64, 32 ], [ 64, 32 ] ]
    head_features: [ 64 ]
    mask_weight: 0.3
    flip_tdc_shape: 2.888
    flip_tdc_scale: 0.357
    flip_present_prob: 0.5

optimizer:
  adamw:
    learning_rate:
      cosine_decay_schedule:
        init_value: 1.0e-3
    weight_decay: 1.0e-6

sampling: { batch: 1024 }
training: { batch: 32, epochs: 2048, samples: 65536 }
validation: { batch: 128, samples: 16384 }
