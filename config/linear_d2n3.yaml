# WINDOWS 2026-09-06: `training.n0` 4096 and `training.n_increment` 2048 on EVERY rung, regressor activation `celu`,
# `iteration_limit` 131072. The paragraphs below that argue for 512/256 or 1024/512 describe the adamaxw era and are
# SUPERSEDED: under adamw + cosine a window grown from a few hundred rows accumulates training optimism
# (2 sigma^2 p_eff / N over thousands of epochs) and never meets the 0.02 bar before ~140k rows, while a 4096 first
# window converges designs at 8k-47k rows with the reported loss on the closed-form Bayes risk. Measured on d2n3 /
# seed 160541601; probes and figure in output/probe-linear-ladder-2026-09-05/, record in docs/handoff-2026-09-04b.md §9.
#
# THE ARM AND ITS TRAINING REGIME ARE NOT IN THIS FILE. They live in `config/strategy/`, shared
# across the whole ladder (one selection, not one per rung), and named on the command line:
#
#     python scripts/bo.py =linear_d2n3 strategy=linear-meta-sp-l06-s1e2 output=... seed=...
#
# `scripts/bo.py` raises if this file also sets `nn_init_strategy` or a retention knob.
strategy: linear-from_scratch-norewind
# ⚠️ `training.n0` 512 and `training.n_increment` 256, HALF `config/linear_d3n4.yaml`'s values.
# That is a THIRD difference from the d3n4 rung and it breaks byte-identity with it, so a spend
# comparison ACROSS rungs is no longer like for like -- the per-design floor here is 683 detector
# calls against 1365 there, and the growth step 341 against 682.
#
# WHY. At n0 1024 a MEASURED 26% of this cell's designs exited at the very first window, so their true
# requirement was at or below the floor and unobserved -- and the designs that exit there report a loss
# BELOW the closed-form `bayes_risk` (mean -0.0025 at the first window against +0.0019 above 12k
# calls). Halving n0 halves the floor and doubles the number of rungs the procedure can resolve before
# a design is forced to stop.
#
# ⚠️ WHAT THIS DOES NOT FIX: BO takes the MINIMUM over designs, so an optimistic estimate is selected
# preferentially -- the incumbent sat exactly at the first window in 9 of 16 cells. A smaller n0
# reduces the optimism per design but not the selection on it.

# ⚠️ SIBLING of `config/linear_d3n4.yaml` at the MIDDLE of the dimension ladder. Beyond n0 and
# n_increment above, two keys differ: `detector` -> `linear_d2n3` (2 dimensions, 3 probes, noise 0.5, 6 design coordinates) and
# `bo.gp.kernel.normalised-invariant-rbf.exchangeable` 4 -> 3. Every training, budget, regressor and
# BO setting is byte-identical, so a difference between the two runs is attributable to the cell.
#
# `exchangeable` MUST equal `n_probes`. The design is a SET of probes and the invariant kernel
# quotients that permutation symmetry; a mismatched value raises `no design field of length <n> to
# permute` at the first GP fit.
#
# MEASURED in docs/linear-highdim.md, closed form over 200000 uniform designs at this cell: optimum
# 0.0937, median random 0.3597, ceiling 0.6923, structural floor 0.0000, span 0.2660 -- within 1.4% of
# the 12-coordinate cell's span, so the two are comparable in how much there is to win.
#
# ⚠️ WHAT THIS RUN CAN AND CANNOT SEPARATE. Section 3.2 of that document puts the driver's residual at
# 0.1%-8% of the range at n = 20 for d = 1 and 2, against 8%-19% at d = 3, and criterion (c) passes
# 0/10 seeds here. So this cell is closer to solved than the 12-coordinate one and is run as the
# middle rung of a dimension ladder, not as a powered arm comparison.

detector: linear_d2n3

regressor:
  set-regressor:
    features: [[24, 32], [32, 24]]
    n_models: 4
    activation: celu

device: cuda
plot_per_epoch: 8

training:
  n0: 4096
  n_increment: 2048
  batch: 128
  eval_batch: 4096
  warmup_epochs: 2
  patience: 16
  budget: 524288
  iteration_limit: 262144
  val_fraction: 0.25
  loss_precision: 2.0e-2
  cosine_epochs: 16
  cosine_peak: 4.0
  optimizer:
    adamw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      normalised-invariant-rbf:
        exchangeable: 3
  ei:
    n_restarts: 32
    n_steps: 100

verify:
  epochs: 128
  warmup_epochs: 16
  val_every_epochs: 10
  budget: null
  batch: null
