# Likelihood-free (LFI) design optimization (scripts/lfi.py). Identical in
# structure to config/subgradient.yaml -- same detector, regressor, rings and
# loop -- EXCEPT the design step: instead of an analytic gradient through
# combine(), the design is descended by the discriminator score-function
# (REINFORCE) estimator. The `lfi:` block replaces `subgradient:`; a
# `discriminator:` net and its optimizer are added.
detector:
  debug:
    pool_split: {train: 0.45, design: 0.45, val: 0.1}   # disjoint streams: nets / design gradient / held-out val

# Initial (nominal) design -> the starting encoded theta (a named physical-design dict).
nominal_design:
  stations: [225.0, 250.0, 350.0, 375.0]
  tilts: [-12.0, -4.0, 4.0, 12.0]
  field_strength: 0.3

regressor:
  set-regressor:
    features: [[64, 32], [64, 32], [64, 32]]

# Unconditional LFI discriminator: same padded set architecture as the regressor
# but a single logit output (no ground truth; theta enters only via combine()).
discriminator:
  set-discriminator:
    features: [[64, 32], [64, 32], [64, 32]]

device: cuda

training:
  # Network (regressor) optimizer.
  optimizer:
    adamw:
      learning_rate: 2.0e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-4

  # Discriminator optimizer.
  discriminator_optimizer:
    adamw:
      learning_rate: 2.0e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-4

  # Design optimizer (its weight_decay is the design L2 reg).
  design_optimizer:
    adamaxw:
      learning_rate: 2.0e-3
      b1: 0.0
      b2: 0.9
      weight_decay: 1.0e-4

lfi:
  epochs: 1024
  steps: 128

  substeps: 64           # regressor (and discriminator) steps per design step
  batch: 32
  ring_capacity: 32768   # 32 * 1024: large pool so the whole-space discriminator generalizes

  design_batch: 128
  design_eps: 0.1

  validation_batches: 128
  validation_batch: 256

  # One-shot warmup before epoch 0: sample `samples` events at the initial design
  # (perturbed per-event by `design_eps`) into a fixed buffer, then run `steps` of
  # network training (each reusing the `substeps` scan). Skipped on resume. Set
  # `samples` or `steps` to 0 to disable.
  warmup:
    samples: 32768       # fill the large rings before training
    steps: 1024
    design_eps: 0.1
