# CAMPAIGN CONFIG -- MM-SYM candidate (detector: config/detector/enzyme_mm_sym.yaml).
# The detector config says what the system IS; this says how a benchmark run is conducted on it.
#
# WHY IT EXISTS. The Stage A screen judged this candidate through the XGBoost proxy objective and it
# FAILED criterion (1) at m=4, 16 read-outs: 0/10 seeds STRONG, median per-seed gain 0.0125 against a
# bar of 10 * loss_precision = 0.1. But that proxy sees the read-outs FLATTENED -- m * n_measurements
# columns, 64 here, deliberately WITHOUT the design coordinates (`detopt/bo/gbdt.py`, `sample_design`)
# -- while the neural objective sees one set element per experiment carrying its own read-outs AND its
# own design coordinates, and is permutation-invariant across experiments. The proxy may therefore be
# understating what this task supports.
#
# THE TARGET IS A VECTOR of 3 numbers (log_K_A, log_K_B, Q10_cat), not a class, so the no-information
# level is the target's own variance (1/3 for the uniform prior) rather than an exact 1.0. That is the
# structural difference from `enzyme_extremes`: the whole baseline-to-best range measured by the proxy
# is 0.2438 -> 0.1406, i.e. 0.103, which is where criterion (d)'s bar of 0.1 becomes hard.
#
# THE TRAINER SETTINGS ARE THE SETTLED DEFAULTS, taken from `config/enzyme_extremes.yaml`, which is the
# VERIFIED reference config (user, 2026-08-15). They are not tuned per task, and the measurements
# behind each are recorded in that file's header. What that fixes here, against the version of this
# config that predated them:
#
#   regressor.p_dropout REMOVED, regressor.dropconnect 0.1 -- dropout is off by default. It used to be
#     applied to raw inputs and to the pooled aggregate, which cost 0.11 of loss at the kinetic task's
#     best design and VOIDS every neural number measured before 2026-08-14. With dropout now on
#     activations only and one hidden width per block, it has nowhere to act, so it is omitted rather
#     than set to a value that does nothing. DropConnect replaces it: unregularised, the network fails
#     to converge and bo.py raises.
#
#   training.param_mix 0.25 -- ADDED; this config had no rewind at all. At each data addition the
#     parameters are pulled a quarter of the way back toward the network the run started from. Plain
#     growth reports a score 0.026 too high on average, 0.058 at worst, and fails to converge 3 of 6.
#     Without it the `meta` arm carries that pathology into the comparison.
#
#   training.iteration_limit 524288 = budget / 4 -- ALSO THE EPOCH LENGTH: steps_per_epoch =
#     iteration_limit // batch, so this gives 2048-step epochs. The coupling is definitional and must
#     not be broken -- warmup_epochs, patience and the convergence posterior are all written in epoch
#     units, so separating them would silently retune the procedure.
#
#   training.patience 16 -- was 32. Patience is the horizon over which the loss must be STILL and is
#     specified to scale WITH iteration_limit; at 2048-step epochs an epoch holds four times the
#     optimisation the 16-32 range was written against, so 16 is the correct end of it.
#
#   training.warmup_epochs 2 -- a SAFEGUARD, not a tuning knob: it only stops the procedure acting
#     before there is anything to act on. Kept low deliberately, since the settled-test is a POSTERIOR
#     and an unsettled early curve already fails it through its own width.
#
#   optimizer.adamw.weight_decay 1.0e-3 -- was 1.0e-6.
#
# NOT CHANGED, and NOT covered by the defaults: n0 2048 and n_increment 1024 are this task's own data
# schedule, half of the `extremes` values. They were left as they were rather than aligned, because
# nothing has been measured that says what they should be here.
#
# training.loss_precision -- 1.0e-2, matching the reference config. STILL A DECLARED PLACEHOLDER on
# this task: it has never been measured to the pre-registration section 5 protocol -- the MAXIMUM
# slack over at least 8 designs x 2 seeds -- on THIS detector. Every number produced with this config
# must say which of its claims depend on it. It also sets criterion (d)'s bar at 10x, i.e. 0.10,
# against a proxy-measured baseline-to-best range of 0.103.

#
# 2026-08-18 -- regressor.dropconnect SET TO 0.0. MEASURED on `linear`, 72 crossed cells (2 arms x
# 4 doses x 3 designs x 3 seeds, paired within design and seed, `bo`): dropconnect adds BIAS THAT THE
# CRITERION CANNOT SEE. Held-out excess against the closed-form floor rises monotonically to +0.00479
# at dose 0.2 -- 48% of the bar -- while `gap`, the only overfitting signal the exit test has, FALLS
# (-0.00041), and the exit window is UNCHANGED (ratio 1.00 at every dose in both arms). The procedure
# therefore buys no extra data in compensation and reports a worse number at the same price. `meta` is
# hurt about half as much as `from_scratch` (+0.00262 against +0.00479 at 0.2), so replay is partly
# REDUNDANT with dropconnect rather than protected from it.

#
# 2026-08-18 (later) -- dropconnect 0.05, NOT null. Reverted from the `null` set earlier the same day.
#
# TURNING IT OFF REMOVED THE TERMINATION MECHANISM FROM BOTH PROCEDURES, which the bias measurement
# did not anticipate:
#   growth  -- the gap gate `gap + err <= loss_precision` needs the gap held down; unregularised the
#              config's own record says designs cap (later shown to be an artefact of a 131072 cap,
#              but the cost is real: 278512 calls/design against ~98281, i.e. 2.8x).
#   fixed   -- stops on the TRAIN-SETTLED test alone, so the only thing that can end a design is the
#              training curve flattening. MEASURED: with dropconnect 0.1, 394 of 394 designs
#              terminated, median 109 s, max 271 s. With dropconnect null, median 476 s, max 2919 s,
#              and designs still running past 3500 epochs with validation rising since epoch 600.
#
# 0.05 RATHER THAN 0.1 because that is where the bias is negligible. MEASURED on `linear`, 72 crossed
# cells, held-out excess against the closed-form floor, paired within (design, seed):
#     dose    from_scratch   meta
#     0.05      +0.00007    +0.00001
#     0.10      +0.00110    +0.00050
#     0.20      +0.00479    +0.00262
# and this task's own earlier record puts 0.05 at -0.0004 on the objective, i.e. free. 0.05 therefore
# buys termination at a bias two orders of magnitude below the dose that motivated turning it off.

detector: enzyme_mm_sym

regressor:
  set-regressor:
    features: [[24, 16], [16, 24]]
    n_models: 4
    dropconnect: 0.05
device: cuda
plot_per_epoch: 8

training:
  n0: 8192
  n_increment: 4096
  batch: 256
  eval_batch: 2048
  warmup_epochs: 2
  patience: 16
  budget: 2097152
  iteration_limit: 524288
  val_fraction: 0.25
  loss_precision: 1.0e-3
  param_mix: 0.25
  optimizer:
    adamaxw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      normalised-invariant-rbf:
        exchangeable: 4
  ei:
    n_restarts: 32
    n_steps: 100

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
