# RUN config for the MM-SYM candidate (detector: config/detector/enzyme_mm_sym.yaml).
# The detector config says what the system IS; this says how a benchmark run is conducted on it.
#
# WHY IT EXISTS. The Stage A screen judged this candidate through the XGBoost proxy objective and it
# FAILED criterion (1) at m=4, 16 read-outs: 0/10 seeds STRONG, median per-seed gain 0.0125 against a
# bar of 10 * loss_precision = 0.1. But that proxy sees the read-outs FLATTENED -- m * n_measurements
# columns, 64 here, deliberately WITHOUT the design coordinates (`detopt/bo/gbdt.py`, `sample_design`)
# -- while the neural objective sees one set element per experiment carrying its own read-outs AND its
# own design coordinates, and is permutation-invariant across experiments. The proxy may therefore be
# understating what this task supports. This config exists to re-score the proxy's best, median and
# worst designs through the SetRegressor and find out.
#
# THE TARGET IS A VECTOR of 3 numbers (log_K_A, log_K_B, Q10_cat), not a class, so the no-information
# level is the target's own variance (1/3 for the uniform prior) rather than an exact 1.0. That is the
# structural difference from `enzyme_extremes`: the whole baseline-to-best range measured by the proxy
# is 0.2438 -> 0.1406, i.e. 0.103, which is where criterion (d)'s bar of 0.1 becomes hard.
detector: enzyme_mm_sym

regressor:
  # A deep set over the batch: one ELEMENT per experiment, its features being that experiment's
  # read-outs followed by its own design coordinates, so the network is design-conditioned and the
  # inference is permutation-invariant in the experiments -- the symmetry of the problem.
  set-regressor:
    features: [[24, 16], [16, 24]]
    n_models: 4      # ensemble: independent members, averaged at evaluation
    p_dropout: 0.1   # measured on the melt task: costs 0.0067 of level, buys a 5.3x cheaper exit

device: cuda

plot_per_epoch: false

training:
  n0: 2048
  n_increment: 1024
  batch: 256
  eval_batch: 2048
  warmup_epochs: 4              # A SAFEGUARD, not a tuning knob: it only stops the procedure
                                # acting before there is anything to act on. Small on purpose --
                                # the settled-test is a POSTERIOR, so an unsettled early curve
                                # already fails it through its own width. 2-4.
  budget: 2097152
  iteration_limit: 131072
  val_fraction: 0.25
  loss_precision: 1.0e-2         # DECLARED PLACEHOLDER, not a measurement (scripts/stage_a.sh, CANDIDATES).
                                 # It has never been measured on this task. Every number produced with this
                                 # config must say which of its claims depend on it.
  patience: 32                  # The horizon over which the loss must be STILL. Requiring N
                                # epochs of stillness IS how the procedure waits for the
                                # regressor's BIAS to disappear, so it must be long enough that
                                # "still" means "the bias has finished moving" and not merely
                                # "the noise was quiet". 16-32, scaling with `iteration_limit`,
                                # which sets how much optimisation one epoch contains.
  optimizer:
    adamw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-6

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      normalised-invariant-rbf:
        exchangeable: 4   # = n_experiments: the batch is a SET

  ei:
    n_restarts: 32
    n_steps: 100

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
