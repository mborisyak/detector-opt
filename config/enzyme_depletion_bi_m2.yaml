# RUN config for `enzyme_depletion_bi`: two-substrate Michaelis-Menten depletion of glucose + ATP,
# with the pair of initial concentrations (A0, B0) per experiment as the whole design.
#
# THERE IS NO REGRESSOR IN THIS TASK'S OWN OBJECTIVE. The objective is the parameter error of an
# ANALYTIC instrument -- the posterior mean of (ln q, ln K_A, ln K_B) on an anisotropic lattice over
# the prior box (EnzymeDepletionBiDetector.estimate) -- evaluated directly, so a design costs about
# half a second instead of a training run and the campaign is driven by
# `scripts/enzyme_depletion_bi_bo.py` rather than by `scripts/bo.py`.
#
# loss_of_a_guess = 1/3, in CLOSED FORM: all three targets are log-uniform and the normalisation is
# affine in the log, so the normalised target is exactly U[-1, 1] and the best constant prediction
# scores its variance. Every number in this task is quoted against it.
#
# bo.gp.kernel -- `sorting-rbf` with `exchangeable: n_experiments`. The design is a SET of (A0, B0)
# PAIRS: running experiments at (1.5, 12) and (8, 2) mM is the same batch as running them in the
# other order, and `detopt.bo._exchangeable_blocks` hands the kernel BOTH design fields so a
# permutation carries each experiment's two concentrations together. Swapping only one field is a
# DIFFERENT batch, not a relabelling, and the detector's own test asserts the objective MOVES when it
# happens. Trust regions are BANNED on this project and none is used.
#
# ⚠️ THE NEURAL BLOCK BELOW IS UNTESTED. Every number in it is either a settled project default or a
# deliberate choice recorded here; NONE of it has been run on this task, because the screening budget
# went to the analytic objective and to two defects it uncovered (see the detector config header).
# Treat it as a starting point that needs a probe run, not as a calibrated setting.

detector: enzyme_depletion_bi_m2


# ---------------------------------------------------------------------------------------------
# regressor -- a small MLP over the SET of experiments: one element per experiment, its features
#   being that experiment's own extent curve (n_measurements values on a FIXED scale -- the top of the
#   box, not its own maximum possible extent min(A0, B0)) beside its two scaled initial concentrations. Those columns reach
#   the network only in the arms that REVEAL the design (`Trainer.reveals_design`); the inference is
#   permutation invariant in the experiments either way, which is the symmetry of the design.
#
# device: cpu -- the detector is a handful of RKC2 chains and the network is tiny, so this task has
#   no use for a shard. `campaign.sh` must therefore be launched with GRES= (empty) so the runs sit
#   beside the GPU work rather than queueing behind an accelerator they never touch.

regressor:
  set-regressor:
    features: [[24, 32], [32, 24]]
    n_models: 4
    dropconnect: 0.05

device: cpu
plot_per_epoch: 8

training:
  # THE GROWTH SCHEDULE IS CHOSEN, NOT INHERITED. The single-substrate task shipped
  # n0 = n_increment = 4096 against iteration_limit = 32768, and the consequence was measured there:
  # every design converged inside the first window, per-design spend took a SINGLE value (5461
  # detector calls), and all four arms therefore bought the same number of designs -- so the arm
  # comparison could not see a cost difference even in principle. Re-measured on that task, n0 = 1024
  # with n_increment = 512 made growth actually fire (3 to 6 distinct per-design costs, ~4x cheaper
  # typical designs, ~3x more designs from the same budget, and a cost asymmetry between arms
  # appearing for the first time). This task starts from that schedule rather than from the shipped
  # one.
  n0: 1024
  n_increment: 512
  batch: 128
  eval_batch: 4096
  warmup_epochs: 8
  patience: 16
  # 2^16. At the first window a design costs n0 + n0 * val_fraction = 1280 detector calls, so a
  # budget of 65536 buys ~51 designs if every design settles immediately and ~20 if the typical
  # design grows three windows. That brackets the 20-30 BO iterations the campaign wants; it is an
  # ESTIMATE until a probe run measures the actual per-design spend.
  budget: 65536
  # ALSO THE EPOCH LENGTH: steps_per_epoch = iteration_limit // batch, so this gives 256-step epochs
  # and leaves the window room to grow 32x above n0 before the procedure runs out of iterations.
  iteration_limit: 32768
  val_fraction: 0.25
  # ⚠️ NOT MEASURED ON THIS TASK. The bar has to sit well below the design-to-design span the
  # optimiser must resolve; on the analytic objective that span is reported by
  # `scripts/calibrate_enzyme_depletion_bi.py --section landscape`. Inherited from the single-substrate
  # task as a starting value and MUST be re-measured from a probe run's own `diff + err` before any
  # campaign number is quoted.
  #
  # NOT THE SAME NUMBER as the `--loss-precision` of `scripts/enzyme_depletion_bi_bo.py`. This one is
  # the TRAINER's convergence slack and belongs to the neural objective. That one is `error` in
  # acceptance clause (d), and on the ANALYTIC objective there is no trainer, so it is the objective's
  # own reproducibility instead -- MEASURED as 0.0031 (good design) to 0.0073 (bad design) over
  # independent event blocks of 1024, hence 5.0e-3 there. Using 1.25e-2 for clause (d) would put its
  # bar at 0.125, above the entire loss range of this task, and fail every candidate by construction.
  loss_precision: 1.25e-2
  param_mix: 0.25
  optimizer:
    adamaxw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      sorting-rbf:
        exchangeable: 2
  ei:
    n_restarts: 16
    n_steps: 60

# THE PRIMARY FIGURE OF MERIT, and it is not the one the sibling task pre-registered.
#
#     P( loss@2n < loss@n ),  over ORDERED PAIRS of DIFFERENT runs, i != j
#
# Different runs, because within one run the incumbent is monotone by construction and the
# comparison returns 1 trivially. This measures what the task exists to show -- whether doubling the
# iteration budget pays RELIABLY, rather than paying on average once enough seeds are averaged.
# `E[loss@n] - E[loss@2n]` is reported beside it, and that difference over loss_of_a_guess is the
# sibling's criterion. Every arm runs on the same seeds, so the random-search null is paired.
criterion:
  checkpoints: [10, 20]
  n_seeds: 64
  n_events: 1024
