# PARAMETER-AVERAGING variant of config/enzyme_depletion_hk_m2.yaml. Byte-identical to it except for
# `training.param_average_epochs`, which is the whole experiment; everything else, `device` included,
# is the control config unchanged.
#
# WHAT IS BEING TESTED. `|val - train|` at convergence has a floor no amount of data reaches, and the
# proposed cause is that a CONSTANT learning rate leaves the iterate in a stationary distribution
# rather than at a point, so the two channels are read at a jittering snapshot. Scoring an AVERAGE of
# the iterates removes that fluctuation and nothing else; `err` is the standard error of two disjoint
# event samples and must be unaffected, so `gap` falling while `err` holds is the signature of jitter
# and both moving (or neither) is not.
#
# THE HORIZON IS ONE EPOCH. `steps_per_epoch = iteration_limit // batch` = 256 here, so the average
# spans exactly the training between two consecutive numbers the convergence procedure reads. Longer
# would reach across `warmup_epochs` into a smaller window; shorter would average too few effectively
# independent iterates to cancel anything.

detector: mm_hk_m2
regressor:
  set-regressor:
    features: [[24, 32], [32, 24]]
    n_models: 4
    dropconnect: 0.05
device: cpu
plot_per_epoch: 8
training:
  n0: 1024
  n_increment: 512
  batch: 128
  eval_batch: 4096
  warmup_epochs: 8
  patience: 16
  budget: 65536
  iteration_limit: 32768
  val_fraction: 0.25
  loss_precision: 1.0e-2
  param_mix: 0.25
  param_average_epochs: 1.0
  replay_weight: 0.25
  optimizer:
    adamaxw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3
verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      sorting-rbf:
        exchangeable: 2
  ei:
    n_restarts: 16
    n_steps: 60
criterion:
  checkpoints: [10, 20]
  n_seeds: 256
  n_events: 1024
