  layer_z_gap: 1.732
  view_z_gap: 5.0
  stereo_bound: [0.0, 0.2]
  magnet_half_cm: 140.0
  station_width: 100.0
  station_clearance: 0.0
  field_integral: -1.069
  z0: 8957.0
  B_sigma: 208.0
  layer_bounds: [8000.0, 10000.0]
  dt: null
  max_dt: 1.0
  max_time: 200.0
  max_particles: 5
  max_hits_per_event: 384
  material: 'kapton'
  wall_thickness: 0.0036
  delta_Tcut: 0.28
  lambda_conv_cm: 95.0
  enable_decay: true
  noise_rate: 0.0
  scatter_xX0: 0.00025
  data_dir: null
  boundary_z: null
  engine: 'realistic'
  hnl_momentum_mean: [0.0, 0.0, 46.7]
  hnl_momentum_sigma: [0.54, 0.65, 28.2]
