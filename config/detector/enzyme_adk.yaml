# ADENYLATE KINASE variant (2026-08-11, user). Same reaction as the baseline -- A + B -> C (+ D)
# via the enzyme E, with product inhibition -- run on a SMALL enzyme instead of a ~50 kDa one, so
# that the melt is wide enough for the objective to vary smoothly with the design.
#
# THE ENZYME. Adenylate kinase, EC 2.7.4.3: ATP + AMP <-> 2 ADP, inhibited by its product. 214
# residues / 23.6 kDa for the E. coli enzyme, a single chain that unfolds two-state -- against the
# ~450-residue cooperative unit the baseline assumes. Note C and D are the SAME species here (both
# ADP), so the two inhibition constants are equal; the baseline's asymmetric pair (tight G6P, weak
# ADP) is a hexokinase property and is not transferable. Shikimate kinase (EC 2.7.1.71, 173 aa)
# would keep distinct products at the price of much thinner calorimetry.
#
# THE POPULATION IS REAL, NOT INVENTED. AdK is the textbook mesophile-to-thermophile series, and the
# prior below is simply its measured spread across organisms: B. subtilis ~47-50 C, E. coli ~55 C,
# G. stearothermophilus ~74 C, T. thermophilus / Aquifex ~78-90 C. So `T_melting: [45, 78]` is one
# enzyme family across its natural hosts rather than a knob turned to make BO work.
#
# WHY THIS FIXES THE LANDSCAPE. Measured on this repo's own `gibbs_fraction` at the literature
# thermodynamics below, the hot-side 10-90% width is 9.8-14.9 K (typical 12.2) with peak folded
# fraction >= 0.985 -- against 4.6-10.2 K for the baseline. The quantity that governs whether a
# batch degenerates is
#
#     useful experiments ~ (prior span) / (transition width) = 33 K / 12.2 K ~ 2.7
#
# measured directly on the baseline as 1.8, where the best m=3 design tiles three probes one width
# apart and the best m=4 design is two useful probes plus junk. At ~2.7, batches of 2-3 remain
# genuinely non-redundant while a probe now informs over +-6 K instead of +-3 K, so moving it 2 K
# changes the loss continuously instead of switching a bump on or off.
#
# NOT COMPARABLE WITH THE BASELINE, by construction: the loss is an expectation over the drawn
# population and `normalize_target` scales by the prior half-range, so both the objective's floor and
# its units move. Compare runs of this config only with each other.
enzyme:
  # 2 (user, 2026-08-11 19:20), down from 4. Pure combinatorics, and it is the batch size -- a
  # DESIGN-SPACE choice -- not an enzyme parameter, so the system itself is untouched.
  #
  # A single experiment lands in the informative window with p ~ 0.12 (the bump is 2 x 3.29 K wide in
  # a 55 K box), so P(>= 2 hits) is 0.014 at m = 2 but 0.073 at m = 4: raising the batch makes a
  # lucky PAIR five times more likely, and two hits already pin T_melting near the read-out noise
  # floor. At m = 4 the design therefore stops being a placement problem and becomes a coverage
  # lottery that random draws usually win -- which is exactly why iterations stopped paying.
  # Measured on 512-design Sobol landscapes, the spread within the best 10% (what BO must resolve at
  # the end) is 0.0084 at m = 4 against 0.0139 at m = 2, a 65% widening.
  n_experiments: 1    # the designed batch: BO searches 2 * n_experiments dimensions
  n_measurements: 8   # [A] read-outs per experiment, evenly spaced, the last at `duration`

  # Stock solutions mixed at t = 0. The design gives the volume fraction taken by the enzyme stock;
  # the A and B stocks split the rest equally, so A0 = B0 = concentration_A * (1 - fraction) / 2.
  concentration_A: 1.0
  concentration_B: 1.0
  # The E stock is set so the CALIBRATED turnover lands in the hexokinase band: at 3e-5 mM the
  # mixture holds ~15 nM of enzyme and k_cat(T*) comes out with a median ~60/s (literature 30-300/s).
  # At 1e-2 mM the calibration had to cripple k_cat to ~0.2/s to still take an hour -- physically
  # wrong by 1000x, though kinetically identical (only the product k_cat*E0 enters the rate).
  concentration_E: 3.0e-5

  duration: 1.0            # one experiment lasts an hour
  measurement_noise: 0.05  # std of the [A] read-out

  # Design bounds -- the volume fraction runs the whole 0 (no enzyme) to 1 (no substrate), because
  # both extremes are useless experiments rather than invalid ones and it is the optimiser's job to
  # discover that.
  enzyme_fraction_bounds: [0.0, 1.0]

  # The temperature range the assay is run over. This is the benchmark's one legitimate difficulty
  # knob -- narrowing the ADMISSIBLE SET is the only change that leaves the objective untouched (same
  # target, same prior, same enzyme population, same normaliser, same noise floor), so before and
  # after stay the same function and remain comparable in Celsius. (Widening the T_melting prior
  # would NOT be: see the note on it below.)
  #
  # Why it is a knob at all. The readout is a THRESHOLD -- activity collapses across the unfolding
  # transition, so an experiment says something about T_melting only while it sits near the edge, and
  # the target IS that edge. The informative window is therefore intrinsically about
  # (prior width 13 C) + (transition width ~7 C) ~ 20 C, and no kinetic parameter moves it:
  # softening the transition destroys the target's identifiability instead of widening the window
  # (measured over delta_H /10 .. x2 in docs/enzyme-gbdt-log.md; the current values are also the
  # physically right ones). Against the full 0-100 C range that window is only 10%, so ~66% of random
  # designs score the target's own variance EXACTLY -- a plateau with a needle in it. Landscape
  # statistics over the candidate boxes, 192 uniformly random PHYSICAL designs each (so these numbers
  # are independent of how the optimiser parameterises its search):
  #
  #   bounds      misses window   plateau   best     median   median/best
  #   [0, 100]        65.6%         3.6%    0.0719   0.2946      4.10
  #   [35, 70]        28.5%         0.0%    0.0402   0.1650      4.10
  #   [40, 65]        14.3%         0.0%    0.0406   0.1272      3.13
  #   [44, 62]         4.5%         0.0%    0.0420   0.0967      2.30
  #
  # The achievable optimum is FLAT at ~0.040 across every narrowed box -- the best design is interior
  # to all of them, so narrowing removes dead region rather than handing the optimiser its answer.
  #
  # ⚠️ PROVENANCE (audited 2026-08-10): only the [0, 100] row is reproducible from data still on disk
  # (output/gbdt/landscape/random_base.json: plateau 3.6%, best 0.0719, median 0.2946, ratio 4.10 --
  # all exact). The three narrowed rows have NO stored landscape JSON anywhere in the tree; the
  # landscape files that exist vary the T_melting PRIOR (melt20_80/melt25_75/melt30_70), not this
  # box. The "misses window" column is also not reproducible from the stored designs at the stated
  # [48, 62] window (which gives 55.7%, not 65.6%; 65.6% needs a 10 C window). Treat the three
  # narrowed rows as UNVERIFIED until re-measured -- and note the box decision below does not rest
  # on them, it rests on the BO-vs-null table further down.
  #
  # SET TO [25, 80] (2026-08-10), WIDENED from [35, 68] on the measurement below. This reverses the
  # direction of the earlier narrowing, and the reason it does is that narrowing optimised the wrong
  # quantity: it maximised how good a design a SHOTGUN finds, when what the benchmark exists to show
  # is that an OPTIMISER's extra iterations are worth more than a shotgun's.
  #
  # Measured with the working (invariant-kernel) optimiser, 8 BO seeds against 10 random
  # instances, 120 iterations, each row's null drawn on its own function (output/wide, output/iters120, output/noise_lo):
  #
  #   box        noise   BO@120    null/BO   p       BO 60->120   null 60->120   ratio
  #   [35, 68]   0.05    0.0357    1.31x     2e-5      1.115x        1.117x       1.00x
  #   [25, 80]   0.05    0.0382    1.38x     0.010     1.226x        1.054x       1.16x
  #   [35, 68]   0.02    0.0158    0.97x     0.62      1.289x        1.230x       1.05x
  #   [25, 80]   0.02    0.0188    1.03x     0.45      1.458x        1.120x       1.30x
  #
  # (An earlier revision of this comment read 1.39x / 1.048x / 1.17x on the second row. Those were
  # computed while one of the ten random-search runs was still finishing; the values above are the
  # complete 8-vs-10 figures. The conclusion is unchanged.)
  #
  # ⛔️ THIS TABLE WAS MEASURED WITH A DEFECTIVE EI GRADIENT (found 2026-08-10 20:5x). All four rows
  # come from output/iters120, output/wide and output/noise_lo, which ran 01:51-03:41. The missing
  # `d diag(x)/dx` term in the EI gradient was not fixed in detopt/bo/bayesian_optimization.py until
  # 13:46 the same day. So every BO arm in this table was proposed by an optimiser whose acquisition
  # gradient was wrong; only the random nulls are unaffected, because random search never calls the
  # GP -- which is precisely why the nulls reproduce bit-identically across the fix and gave false
  # comfort that nothing had changed.
  #
  # HOW MUCH THIS MATTERS, measured: re-running `permutation-invariant-rbf` at [25, 80] under the
  # FIXED optimiser (output/kernel-norm, 12 seeds) gives null/BO = 0.997x -- exactly the null --
  # against the 1.376x in the row below. Same seeds, same box, same kernel: the first five
  # iterations are bit-identical (the random initial design) and the trajectories diverge at
  # iteration 6, the first GP-driven proposal. The measured value of the invariant kernel therefore
  # does NOT survive the fix, and neither should this table be trusted until re-run.
  #
  # THE BOX DECISION RESTS ON IT and has not been re-confirmed. Left at [25, 80] because reverting on
  # equally untrustworthy evidence would be no better; re-running the four rows under the current
  # optimiser is the outstanding work.
  #
  # ⚠️ EVEN IF IT IS RE-RUN, how much weight it carries -- audited 2026-08-10 -- is LESS than it looks.
  # The arithmetic is exact; the inference is weak on three counts, all recorded in
  # docs/enzyme-gbdt-log.md:
  #
  #   * The p column is ONE-SIDED. Two-sided it is 4.6e-5 / 0.021 / 1.0 / 0.90. Each row has its OWN
  #     null (verified: the four null sets differ by up to 0.16 in best-so-far), so these are four
  #     independent tests and Holm across them changes little: 9.0e-5, 0.031, 0.90, 0.90. Both 5%
  #     rows survive; the 2% rows were never significant.
  #   * The last column's bootstrap 95% CI CONTAINS 1 on every row (e.g. [0.901, 1.294] for the row
  #     this box was chosen on). Recomputed per-seed instead of as a ratio of medians, p = 0.14. The
  #     ratio ORDERS the boxes; it does not establish that any of them differs from 1.
  #   * It is checkpoint-sensitive: read at 30 iterations instead of 60 the four rows give
  #     1.058 / 0.940 / 1.134 / 1.109, so the [25, 80] 5% row -- the one this box rests on -- inverts.
  #
  # And the selection is CIRCULAR: the 1.16x that justifies this box is measured on the same runs
  # that are then reported as the result for it. Choosing the box this way is defensible as a design
  # decision; quoting the same number afterwards as evidence FOR the box is not. A clean confirmation
  # would need fresh seeds at [25, 80], which have not been run.
  #
  # The last column is the point. At [35, 68] doubling the iteration budget helps BO and random
  # EXACTLY equally (1.00x), so a strategy that fits twice the iterations into the same wall clock
  # wins nothing an optimiser-blind baseline would not also win. At [25, 80] BO's extra iterations
  # are worth 1.16x the null's, and BO still beats it outright (1.38x, p = 0.01) -- both halves of
  # the brief at once. The 2% read-out rows show the trade the other way: the largest differential
  # payoff in the table, but BO only TIES the null, which is no showcase for an optimiser.
  #
  # The cost is 0.04 C of absolute resolution (1.23 -> 1.27 C at 120 iterations), which is the dead
  # volume BO has to spend its early iterations learning to avoid. That is the mechanism, not a side
  # effect: a surrogate earns its advantage where there is somewhere it can learn NOT to propose.
  #
  # NOT trustworthy for this knob: the `screen` landscape statistics (correlation length, headroom)
  # rank [25, 80] mid-table. They describe how much a benchmark rewards more evaluations BY ANYONE,
  # which is a different question, and they got this one wrong. See docs/enzyme-gbdt-log.md.
  # ⛔️ REVERTED TO [25, 80] (2026-08-11). [42, 69] was selected by the campaign below and then
  # REJECTED as broken: it leaves only 3 C below the lowest T_melting (45) while leaving 11 C above
  # the highest (58). Measured from `gibbs_fraction`, a bottom-of-prior enzyme's transition spans
  # 41.7-47.9 C at the median unfolding enthalpy and reaches down to 25.9 C for broad-transition
  # ones, so the box clips the probes those enzymes need; nothing above ~61 C is informative for any
  # enzyme in the prior, so 8 C of its range is dead by construction. Worse, no experimenter knowing
  # only `T_m in [45, 58]` would choose bounds that lopsided -- it encodes knowledge of where the
  # answer lies, which a benchmark must not.
  #
  # The design box is therefore left at the wide, defensible [25, 80] and the instability is being
  # attacked where it originates instead: the GP's lengthscale prior. Replaying the recorded designs
  # of finished runs through the same surrogate, narrowing `log_lengthscale_prior_bounds` from
  # [-6, 4] to [-1.5, 0.5] raises the spread of the posterior's predicted means from 0.105 to 0.251
  # of the data's own spread -- i.e. it stops the GP predicting nearly the same value everywhere,
  # which is the flat-surrogate failure. See docs/enzyme-retune-log.md and output/lengthscale.
  #
  # HISTORICAL, the rejected selection: [42, 69] leaves only 3 C below
  # the lowest T_melting (45) and 11 C above the highest (58). Measured from `gibbs_fraction` at the
  # prior's extremes, a bottom-of-prior enzyme's transition (90% -> 10% folded) spans 41.7-47.9 C at
  # the median unfolding enthalpy and reaches down to 25.9 C for the broad-transition ones, while
  # NOTHING above ~61 C is informative for any enzyme in the prior. So this box clips the probes the
  # hardest enzymes need and spends 8 C where every enzyme is already dead. It is also not a box any
  # experimenter would choose knowing only `T_m in [45, 58]`: it encodes knowledge of where the
  # answer lies. output/realistic is testing [40, 69], [38, 67] and [40, 65] -- >= 5 C of margin
  # below the prior -- on the same criterion; this setting updates when they land.
  #
  # SET 2026-08-11 from output/box (9 arms x 16 BO + 16 null seeds x 60 iterations, no failures),
  # criterion pre-registered before the runs: the PER-SEED payoff over the 15 -> 30 doubling, BO's
  # gain divided by its own null's. [42, 69] wins it. Full arm table in docs/enzyme-retune-log.md.
  #
  #   arm   box x fraction        payoff  CI95            select->confirm  median@30  IQR     wins/16
  #   a27   [42,69] x [0,1]       1.207   [0.956,1.358]   1.185 -> 1.275   0.0478     0.0092  12
  #   m3    [39,72] m=3           1.181   [0.999,1.293]   1.104 -> 1.094   0.0687     0.0154  11
  #   a33   [39,72] x [0,1]       1.101   [1.000,1.223]   1.176 -> 1.146   0.0511     0.0096  11
  #   t55   [25,80] x [0,1] (old) 1.094   [0.901,1.223]   1.224 -> 1.107   0.0553     0.0173  12
  #   a33f  [39,72] x [0.2,0.7]   1.014   [0.882,1.129]   1.068 -> 1.102   0.0404     0.0058  13
  #   a27f  [42,69] x [0.2,0.7]   1.000   [0.827,1.022]   1.017 -> 1.011   0.0440     0.0038   7
  #
  # WHY THIS BOX. Two independent properties, both measured without an optimiser in the loop
  # (output/screen0, output/screen1; 192 and 384 random designs a variant):
  #   * ASYMMETRY. The informative window is [48, 62] -- centred on 55, not on the T_melting prior's
  #     51.5 -- because an experiment learns nothing below the transition, where every enzyme reads
  #     fully folded. Shifting the same width upward beat the symmetric box at EVERY width on best,
  #     median AND room: [40,64] 0.0447/2.56x -> [43,67] 0.0415/2.72x; [38,65] 0.0465/2.70x ->
  #     [42,69] 0.0393/2.98x; [35,68] 0.0460/3.26x -> [39,72] 0.0383/3.52x.
  #   * WIDTH. Expected signal among the 5 Sobol initial designs falls monotonically with width
  #     (4.87 of 5 at 20 C to 3.95 at 38 C) while room grows (2.30x to 3.39x). The old [25, 80]
  #     was the worst of both: only 2.9 of 5 initial designs carried signal, so the GP started from
  #     a nearly flat dataset. 27 C is the interior compromise.
  #
  # WHAT WAS REJECTED, and this one reversed the screens. Narrowing `enzyme_fraction_bounds` to
  # [0.2, 0.7] gives the BEST absolute losses (0.0404, 0.0440) and the tightest seed spread, but it
  # takes the payoff to 1.00-1.01: removing the f->0 / f->1 corners removes dead volume, and dead
  # volume is what an optimiser learns to avoid while a shotgun keeps spending draws on it. a27f's
  # seed IQR collapses to 0.0038 -- every design nearly as good as every other, nothing left to
  # convert iterations into. The screens ranked those arms first; the campaign reversed it, which is
  # the third time landscape statistics have mispredicted a campaign here.
  #
  # NOT ESTABLISHED. Nothing survives Holm over the nine arms (best 0.272) and a27's CI contains 1
  # at the low end, so this is the best-supported setting rather than a proven one. Note also the
  # deliberate trade: BO's absolute margin over random is LOWER here (1.191x at k=30) than at the old
  # box (1.326x). The brief asks for iteration CONVERSION, and random search beating BO was declared
  # acceptable; that is what this buys.
  # [35, 68] (user, 2026-08-11 19:40): a 10 C MARGIN either side of the T_melting prior [45, 58].
  # The margin is the point -- it is 3x the transition half-width (3.29 C), so the optimal probe for
  # any enzyme in the population sits well inside the box with room to spare, which is what makes
  # this a box a sane experimenter would choose rather than one that encodes where the answer is.
  # That was the objection that killed [42, 69] (3 C below the lowest melting point, 11 above the
  # highest); 10 and 10 is symmetric and generous on both sides.
  #
  # What it buys: a single experiment lands in the informative window with p ~ 2*3.29/33 = 0.20,
  # against 0.12 at [25, 80] -- so the initial random designs carry signal more often, which is the
  # stated requirement for BO to have anything to model early. It also cuts the dead volume that
  # made uninformative designs the EXPENSIVE ones (a ceiling design measured at 68266 calls).
  temperature_bounds: [35.0, 88.0]

  # The objective: conversion of the 1/3 E : 1/3 A : 1/3 B mixture after `duration`. Its maximising
  # temperature is the target. (The mixing rule makes fraction = 1/3 exactly that mixture.)
  objective_fraction: 0.3333333333333333

  # Turnover calibration. `log_k0_cat` is the one kinetic parameter NOT drawn from the prior: instead,
  # every drawn enzyme is rescaled so that the mixture at `calibration_fraction`, at its own fastest
  # temperature, reaches half conversion at a time drawn log-uniformly from `half_time_bounds` (hours).
  # Turnover enters the rate as a single multiplicative factor, so this is an exact rescaling of every
  # timescale and it does not move which temperature is fastest. Without it a uniform prior over
  # log_k0_cat would put most enzymes either finished or untouched within the hour, carrying no
  # information either way; with it the whole prior is measurable in one `duration`.
  calibration_fraction: 0.5
  half_time_bounds: [0.25, 2.0]

  # Prior over an UNKNOWN HEXOKINASE VARIANT -- the reaction this model describes is literally
  # hexokinase's: glucose (A) + ATP (B) -> glucose-6-phosphate (C) + ADP (D), bi-substrate with both
  # products inhibitory. Ranges are the approximate literature spread across isoforms and species
  # (HK I/II/III, yeast), NOT one isoform. Every parameter is drawn uniformly within its range, so a
  # `log_*` range is log-uniform on the quantity itself. `log_k0_cat` is absent by construction --
  # the turnover scale is calibrated, not drawn (see HALF_TIME_BOUNDS in detopt/detector/enzyme.py).
  #
  # Two deliberate exclusions. Glucokinase (HK IV) is left out: its K_M(glucose) ~ 5-10 mM together
  # with the tight G6P inhibition of HK I/II would be a combination no real isoform has (glucokinase
  # is not product-inhibited at all), and that impossible corner is also by far the stiffest thing
  # the solver would ever see. And this model makes product inhibition COMPETITIVE on the substrate,
  # whereas HK I's G6P inhibition acts at a separate site -- the constants are real, the functional
  # form is a simplification.
  parameters:
    log_K0_A: [-3.00, -1.20]  # K_M AMP: 0.05 .. 0.3 mM (AdK, ~0.1 mM)
    Q10_A: [0.7, 2.0]         # its per-10C factor -- K_M drifts only mildly with temperature
    log_K0_B: [-2.99, -1.20]  # K_M ATP: 0.05 .. 0.3 mM (AdK, ~0.1 mM)
    Q10_B: [0.7, 2.0]
    log_K0i_C: [-2.30, -0.69] # Ki, ADP: 0.1 .. 0.5 mM -- C and D are the SAME product here,
    Q10_C: [0.7, 2.0]
    log_K0i_D: [-2.30, -0.69] # so the two constants match: AdK makes 2 ADP
    Q10_D: [0.7, 2.0]
    Q10_cat: [1.8, 2.6]       # Arrhenius slope of the turnover: Ea 40 .. 60 kJ/mol
    delta_H: [3.61e4, 4.57e4] # 300 .. 380 kJ/mol, AdK calorimetry (214 residues, two-state)
    delta_C: [1.32e3, 1.56e3] # 11 .. 13 kJ/mol/K, i.e. ~55 J/mol/K per residue
    # The TARGET the regressor infers. Deliberately UNCHANGED, and not a tuning knob at all.
    #
    # Widening this range does not make the benchmark easier to optimise, it makes it a DIFFERENT
    # objective. The loss is an expectation of predictive MSE over the drawn enzymes, so a wider
    # prior averages over a wider population and moves the objective's own minimum and its
    # irreducible (noise-set) floor. On top of that `normalize_target` scales by this very range, so
    # the reported number shrinks for free. Measured, widening to [25, 75]: normalised loss
    # 0.089 -> 0.060 while the physical resolution got WORSE, 1.94 C -> 6.11 C RMSE. Nothing before
    # and after such a change is comparable.
    #
    # The benchmark's difficulty belongs in the DESIGN SPACE -- which designs the optimiser may
    # choose -- because narrowing that leaves the target, the enzyme population and the floor
    # identical. See `temperature_bounds` above.
    T_melting: [45.0, 78.0]   # the AdK homologue series, mesophile to thermophile

  # ---------------------------------------------------------------------------------------------
  # Numerics: the resolution of each numerical procedure. None of these change the physics -- they
  # decide how accurately it is computed -- and each is justified by a script that re-derives it
  # (scripts/check_stability.py for the step, scripts/verify_lsoda.py for the scheme itself).
  # ---------------------------------------------------------------------------------------------

  # Golden-section contractions locating a temperature extremum: T* (the target) and the calibration
  # optimum. Each contraction is ONE integration and shrinks the bracket by 0.618, so 20 take the
  # 100 C range to 100*0.618^20 = 0.0066 C. That is finer than the 384-point scan this replaced
  # (0.009 C median) for 22 integrations instead of 384.
  n_temperature_steps: 20
  # Trapezoid nodes for the calibration's tau(T) = int_0^x_half dx/rate. The calibration is a
  # quadrature over the EXTENT, not a time integration, so this is its only resolution knob.
  n_quadrature: 33
  # RKC2 steps per objective integration -- one `duration` in one interval, so dt = 1/640 h = 5.6 s.
  n_objective_steps: 640
  # RKC2 steps per read-out interval. With n_measurements = 8 that is 8 * 80 = 640 steps per
  # experiment, i.e. deliberately the SAME dt as the objective integration.
  n_steps_per_measurement: 80
  # RKC2 stages per step. The scheme spends s rate evaluations to push a damped Chebyshev polynomial
  # along the negative real axis, so its stability boundary grows like s^2 instead of Euler's fixed 2:
  # measured z = 16.60 at s = 5 (3.32 per evaluation vs Euler's 2.0). The stiffest corner of the prior
  # has |df/dx| = 4765/h, giving dt_max = 3.5e-3 h; the counts above run at 1.56e-3 h, z = 7.3, a
  # 2.3x margin. Past the boundary this is not inaccuracy -- the extent leaves its physical range and
  # never comes back. float32 gives out at s = 10, where roundoff in the recursion leaves no stable
  # interval at all.
  n_stages: 5
  # Verwer's damping epsilon = 2/13. It lifts |R(z)| off 1 between the polynomial's extrema, turning
  # the bare Chebyshev scheme's tangency into a strip of genuine stability -- without it the boundary
  # is theoretically longer but touches |R| = 1, so roundoff alone can destabilise a step.
  damping: 0.153846
  # Guard threshold, in mM, on the error the solve estimates for ITSELF: every integration runs a dt
  # and a dt/2 chain and reports max|fine - coarse|, and __call__ raises if that exceeds this. Set to
  # 10% of measurement_noise -- the integration must not disturb what the read-out itself resolves.
  # The true error runs ~1000x inside it (LSODA-checked).
  integration_tolerance: 5.0e-3
