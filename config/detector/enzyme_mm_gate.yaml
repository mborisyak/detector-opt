# Full config for the `enzyme_mm` detector (EnzymeMMDetector): EVERY __init__ parameter.
# Michaelis-Menten COEFFICIENT RECOVERY on A + B -> C + D via an enzyme E -- the same chemistry as
# config/detector/enzyme.yaml, but the batch has to estimate the enzyme's kinetic coefficients instead
# of its melting point, the ATP concentration is a design coordinate, and the temperature box sits
# below the melt. Plan: docs/task-mm-recovery.md. Gate: output/screen/provenance-mm.md.
#
# EVERY ENTRY CARRIES ITS SOURCE. `measured` = a literature value quoted in the plan; `ESTIMATE` = my
# reasoning, stated. Concentrations are mM, times hours, temperatures degrees Celsius.
#
# THE READ-OUT IS SHARPER THAN THE BASELINE ASSAY'S, and that is this variant's declared deviation:
# measurement_noise is 0.005 mM against the melt config's 0.05 mM (duration and n_measurements ARE the
# melt config's, unchanged). The instrument argument is at `measurement_noise` below and in
# output/screen/provenance-mm-gate.md section 5.1, and every design bound is stated against the
# 0.005 mM floor. The other structural change is that BOTH substrates are now varied (below).
#
# ONE CONVENTION TO READ EVERYTHING BY: every kinetic constant below is its value at **25 C**, the
# temperature enzyme kinetics are conventionally reported at and one inside the design box. The melt
# model anchors at 0 C, which is fine for a nuisance and fatal for a target -- a 0 C-anchored constant
# is reachable from a 10-35 C box only by extrapolating through its own Q10, and on this prior that
# extrapolation alone spreads ln K by about as much as the parameter's own prior, i.e. it would sit at
# ~1/3 of its prior variance however good the design. Re-anchoring is a change of coordinates on the
# same van 't Hoff curve, not a change of physics (detopt/detector/enzyme_mm.py).
#
# THE MIXING CONSTRAINT IS WAIVED (user, 2026-08-12). The melt model derives every initial
# concentration from one volume fraction (`A0 = concentration_A * (1 - fraction) / 2`); here each
# initial concentration is its own coordinate with its own bounds. Stocks can be made up at whatever
# strength the experiment needs, so the mixing ratio is bookkeeping rather than physics. What stays
# physical is what each bound is stated FROM: solubility/practical stock strength at the top, the
# read-out noise floor at the bottom for the MEASURED species, the min(A0, B0) conversion cap for the
# co-substrate, and pipetting practicality for the enzyme.
enzyme_mm:
  # The designed batch: BO searches 4 * n_experiments dimensions -- [A]0 is a design coordinate here
  # (concentration_A_bounds is set), not the baseline config's fixed assay constant. m ~ p, one
  # experiment per IDENTIFIABLE coefficient (see target_parameters). That is the structural rule this
  # task exists to satisfy: a D-optimal design for p parameters puts mass on ~p support points, so at
  # m ~ p every experiment in the batch has a job and the information matrix has a clean interior
  # maximum. m < p leaves the target underdetermined by construction; m > p makes the batch redundant,
  # which is the melt benchmark's failure (p = 1 against m = 4, its best design being two useful probes
  # plus junk). The screen runs m = 2, 3, 4 so the choice is visible rather than asserted.
  n_experiments: 3
  # [A] read-outs per experiment, evenly spaced, the last at `duration`. A FIXED grid, identical for
  # every experiment and every design -- sampling times are NOT a design coordinate (plan section 4),
  # which is what lets the combined element carry time positionally. Assay parameter, unchanged from
  # the melt config.
  n_measurements: 8

  # ---------------------------------------------------------------------------------------------
  # The assay -- UNCHANGED from config/detector/enzyme.yaml except where stated.
  # ---------------------------------------------------------------------------------------------
  # Enzyme stock concentration; the design's `enzyme_fraction` is the volume fraction taken from it, so
  # E0 = concentration_E * enzyme_fraction. A PURE UNITS CHOICE, and provably not a tuning knob: the
  # turnover calibration fixes the PRODUCT k_cat * E0 from `half_time`, so changing this constant
  # changes k_cat by the exact inverse and leaves every trajectory identical. It is set so the reported
  # k_cat lands in hexokinase's measured 30-300 /s band -- i.e. so the model's numbers are physical
  # rather than a 1000x-wrong bookkeeping artefact. MEASURED: scripts/validate_mm.py --mode build.
  concentration_E: 8.0e-6
  duration: 1.0  # one experiment lasts an hour. Assay parameter, unchanged from the melt config.

  # Read-out noise: ABSOLUTE Gaussian, sigma = measurement_noise, INDEPENDENT of the concentration
  # being read -- the model carries no proportional term.
  # measurement_noise 0.005 mM is SHARPER than the melt config's 0.05 mM, and that is a declared
  # deviation (output/screen/provenance-mm-gate.md section 5.1): this task measures concentrations
  # AROUND K_M(glucose) ~ 0.06 mM, so a 0.05 mM sigma would be the entire signal and the sub-saturating
  # half of the box -- the half that identifies K_M at all -- would sit inside the noise. ESTIMATE from
  # the instrument, not from a landscape: NAD(P)H at 340 nm has eps = 6220 /M/cm, so 0.01 AU in a 1 cm
  # cell is 1.6 uM, and 5 uM is a conservative plate-reader sigma. Every design bound below is stated
  # against THIS floor.
  measurement_noise: 0.005

  # ---------------------------------------------------------------------------------------------
  # Design bounds. Design dimensionality is 4 * n_experiments: per experiment
  # (enzyme_fraction, temperature, [A]0, [B]0) -- `concentration_A_bounds` is set, so [A]0 is a design
  # coordinate and `_design_layout` appends it (detopt/detector/enzyme_mm.py).
  #
  # BOTH SUBSTRATES ARE VARIED HERE, which is what this variant exists to test. In the baseline config
  # glucose is held fixed and saturating: [A] is the species the photometer reads, and its K_M prior
  # (0.02-0.2 mM) lies BELOW that config's 0.05 mM read-out floor, so a sub-saturating glucose arm
  # would sit inside the noise. This config buys the arm back with a SHARPER read-out (0.005 mM), which
  # puts 2 sigma at 0.01 mM -- HALF the K_M(glucose) prior's own bottom (0.02 mM) -- so glucose can be
  # swept over its whole Michaelis range too, and K_M(glucose) is SCORED rather than a nuisance.
  # K_M(ATP) (0.1-1 mM) is swept as before and the rate's B/(B+K_B) factor identifies it.
  #
  # The three MULTIPLICATIVE coordinates are scaled LOGARITHMICALLY onto [0, 1] (the detector's
  # _to_scaled_flat). That is how an experimenter varies them -- a dilution series -- and a linear map
  # would put essentially the whole Sobol sample above 0.1x the top of the range, so the sub-saturating
  # half that identifies K_M would never be sampled. It changes the search MEASURE, not the admissible
  # set: the box is the same box.
  # ---------------------------------------------------------------------------------------------
  # A DESIGN COORDINATE here, not the fixed assay constant of the baseline config: this variant SCORES
  # K_M(glucose) (see target_parameters), so the box has to straddle the K_M(glucose) prior (0.02-0.2 mM)
  # on BOTH sides -- without a sub-saturating and a saturating [A]0, K_M and k_cat are not separable.
  # RULE (output/screen/provenance-mm-gate.md section 2), from the prior and this config's noise only:
  #   top   2.0 mM = 10x the prior's highest K_M (0.2 mM);
  #   floor 0.01 mM = 0.1x the prior's lowest (0.02 -> 0.002 mM), RAISED to the read-out floor, i.e. to
  #         2 SIGMA of measurement_noise 0.005 mM -- total conversion is capped by [A]0 itself, so at
  #         the floor the whole progress curve is 2 sigma tall and anything lower is noise.
  # K_M(glucose) stays drawn per event (see `parameters` below); this sub-saturating arm is what makes
  # it identifiable rather than a nuisance.
  concentration_A_bounds: [0.01, 2.0]
  # RULE: the same one, on the K_M(ATP) prior (0.1-1 mM). Floor 0.01 mM = 0.1x its lowest, which here is
  # ALREADY at the read-out floor (2 sigma of 0.005 mM), so no raising was needed; top 10 mM = 10x its
  # highest. The co-substrate conversion cap is what makes the floor binding -- total conversion is
  # min(A0, B0), so below 2 sigma the whole curve shrinks into the read-out noise whatever the enzyme
  # does.
  concentration_B_bounds: [0.01, 10.0]
  # RULE: instrument, independent of the prior. Upper = neat stock. Lower = 1%, the smallest volume
  # fraction that can be pipetted reliably (1 uL into 100 uL). Strictly positive because the coordinate
  # is log-scaled, and because "no enzyme at all" is not an experiment anyone runs. This axis matters
  # for identifiability specifically: k_cat and E0 enter the initial rate only as a PRODUCT, so varying
  # E0 is what separates them.
  enzyme_fraction_bounds: [0.01, 1.0]
  # RULE: upper = 5 C BELOW THE LOWEST MELTING POINT IN THE PRIOR (40 C), so no experiment probes the
  # unfolding transition -- the defining property of this task, checked numerically by
  # min_folded_fraction below. Lower = 10 C, a standard cold-room assay temperature and the coldest an
  # aqueous buffer assay is routinely thermostatted at. The 25 K span gives Q10_cat = 2.2 a 5.7x rate
  # swing, ample to identify a temperature slope.
  temperature_bounds: [10.0, 35.0]

  # ---------------------------------------------------------------------------------------------
  # The target, CHOSEN BY IDENTIFIABILITY (plan section 5, acceptance section 4.2), not by taste.
  # Only [A](t) is measured, so a target containing an unidentifiable direction would carry a floor no
  # design can beat. scripts/validate_mm.py --mode fim computes the Fisher information of the measured
  # [A](t) with jax.jacfwd straight through the solver, marginalises the nuisances with their own prior
  # (I_eff = I_tt - I_tn (I_nn + 3I)^-1 I_nt; a uniform prior on [-1, 1] has precision 3) and reports the
  # implied posterior variance against the prior's 1/3.
  #
  # THREE ROLES, and every drawn parameter has exactly one:
  #   SCORED (this list)  log_K_B (K_M of the VARIED substrate) and Q10_cat (the turnover's temperature
  #                       slope) -- the two the design has levers for: a substrate axis and a temperature
  #                       axis. log_Ki_D joins them only if the Fisher information supports it.
  #   DRAWN, NOT SCORED   log_K_A, Q10_A/B/C/D, log_Ki_C, log_Ki_D, delta_H, delta_C, T_melting -- real
  #                       population variability the estimator must marginalise over. log_K_A in
  #                       particular is NOT switched off: at [A]0 = 0.5 mM it still swings the rate by
  #                       ~35% across its prior (A/(A+K_A) runs 0.96 -> 0.71) and the curve crosses it
  #                       late in the run, so it genuinely perturbs the read-out. It is unscored because
  #                       with glucose held saturating it is only weakly identifiable, and scoring a
  #                       direction the data cannot support puts an irreducible floor on the loss.
  #   FIXED               nothing that the melt model drew. No parameter was switched off.
  # The loss is the MEAN over the scored components of the squared error in units of each component's OWN
  # prior half-range (normalize_target), so every coefficient contributes comparably and predicting the
  # prior mean still scores 1/3.
  target_parameters: [log_K_A, log_K_B, Q10_cat]

  # ---------------------------------------------------------------------------------------------
  # Turnover calibration. The turnover SCALE is the one kinetic quantity not drawn: every enzyme is
  # rescaled so that a FIXED reference assay half-converts at a time drawn log-uniformly from
  # half_time_bounds. Turnover enters the rate as a single multiplicative factor, so this is an exact
  # rescaling of every timescale. Without it a uniform prior over the turnover would put most enzymes
  # either finished or untouched within the hour, carrying no information either way.
  #
  # The reference is design-INDEPENDENT on purpose: a design-dependent reference would make the drawn
  # enzyme -- and therefore the target -- depend on the design, breaking the common-random-numbers
  # contract the whole benchmark rests on.
  # ---------------------------------------------------------------------------------------------
  # The assay's own glucose concentration (see concentration_A).
  calibration_concentration_A: 0.0632
  # FROM THE PRIOR: the GEOMETRIC MEAN of the K_M(ATP) prior, sqrt(0.1 * 1.0) -- the concentration at
  # which the median enzyme is half saturated, which is the assay a competent experimenter runs first.
  calibration_concentration_B: 0.3162
  # FROM THE PRIOR: the geometric mid-point of the enzyme dilution range, sqrt(0.01 * 1.0).
  calibration_fraction: 0.1
  # The anchor temperature: the same 25 C the drawn constants are the value at, so `half_time` is the
  # half-conversion time of the reference assay at the reference temperature. Unlike the melt model there
  # is NO search for the fastest temperature -- below the melt the rate is monotone in T, so "fastest"
  # would simply be the top of the design box and would tie the meaning of half_time to the box.
  calibration_temperature: 25.0
  # ESTIMATE: the population spread of absolute turnover, bracketed so the reference assay is neither
  # over within the first read-out interval (duration / n_measurements = 0.125 h) nor unfinished at
  # `duration`. This calibration is what makes the whole prior measurable in one experiment. Unchanged
  # from the melt config.
  half_time_bounds: [0.25, 2.0]

  # ---------------------------------------------------------------------------------------------
  # Prior over an UNKNOWN HEXOKINASE VARIANT -- the reaction this model describes is literally
  # hexokinase's: glucose (A) + ATP (B) -> glucose-6-phosphate (C) + ADP (D), bi-substrate with both
  # products inhibitory. Ranges are the approximate literature spread across isoforms and species, NOT
  # one isoform. Every parameter is drawn uniformly within its range, so a `log_*` range is log-uniform
  # on the quantity itself. Reported values are spread over three orders of magnitude across isozymes
  # and assay conditions (free Mg2+ especially), so if anything these one-decade ranges are NARROWER
  # than the literature supports.
  # ---------------------------------------------------------------------------------------------
  parameters:
    # measured: yeast hexokinase K_M(glucose) 0.14 +- 0.002 mM; ~50 uM by initial-velocity kinetics;
    # HK I/II ~0.03-0.05 mM. Range 0.02 .. 0.2 mM, at 25 C. DRAWN, NOT SCORED (see target_parameters).
    log_K_A: [-3.91, -1.61]
    # ESTIMATE: a Michaelis constant drifts only mildly with temperature and may go either way, so a
    # range straddling 1. Same for Q10_B/C/D.
    Q10_A: [0.7, 2.0]
    # measured: yeast hexokinase K_M(ATP) 0.27 +- 0.02 mM. Range 0.1 .. 1 mM, at 25 C. SCORED.
    log_K_B: [-2.30, 0.0]
    Q10_B: [0.7, 2.0]
    # measured: Ki(G6P) 65 uM, competing with ATP at the active site -- tight, as modelled.
    # Range 0.02 .. 0.2 mM, at 25 C.
    log_Ki_C: [-3.91, -1.61]
    Q10_C: [0.7, 2.0]
    # measured: Ki(ADP) Kis 0.86, Kii 1.0, Kid 1.9 mM -- weak, as modelled. Range 0.3 .. 3 mM, at 25 C.
    log_Ki_D: [-1.20, 1.10]
    Q10_D: [0.7, 2.0]
    # measured/typical: Q10 2-3 for biological rates, Ea 50-100 kJ/mol typical for enzymic reactions.
    # 1.8-2.6 is Ea 40-60 kJ/mol -- mildly conservative, and the plan notes widening to 2.0-3.0 would be
    # defensible. Left as the melt config has it, since it is a shared population parameter. SCORED.
    Q10_cat: [1.8, 2.6]
    # ESTIMATE, and RAISED from the melt config's [4.5e4, 1.0e5]. Not a tuning knob -- a thermodynamic
    # consistency requirement. `gibbs_fraction` is the Gibbs-Helmholtz stability curve, which has TWO
    # roots: the melt and COLD DENATURATION below it, separated by delta_H / delta_C. The melt config's
    # ratio (10-40) puts the cold root at 0-25 C: at its worst prior corner the folded fraction is 0.44
    # at 25 C and ~0 at 10 C, so over THIS task's box the model would be measuring cold denaturation
    # rather than Michaelis-Menten kinetics. Real globular proteins put cold denaturation below 250 K,
    # which needs delta_H / delta_C >~ 37; this range gives 27-84. It is anchored on the measured
    # specific unfolding enthalpy of small globular proteins near 50-70 C -- lysozyme ~500 kJ/mol at
    # 14.3 kDa, RNase A ~450 kJ/mol at 13.7 kDa, i.e. 30-35 J/g -- applied to a ~50 kDa hexokinase
    # monomer over a 20-35 J/g band. Over R that is 1.2e5 .. 2.1e5 K (= 1.0 .. 1.75 MJ/mol).
    delta_H: [1.2e5, 2.1e5]
    # ESTIMATE: ~50 J/mol/K per residue (lysozyme 6.5 kJ/mol/K over 129 residues) x ~450 residues for a
    # ~50 kDa monomer. Over R that is 2.5e3 .. 4.5e3 K (= 21 .. 37 kJ/mol/K). Unchanged from the melt
    # config.
    delta_C: [2.5e3, 4.5e3]
    # measured: yeast hexokinase B melts at ~41.9 C and inactivates dissociatively between 40 and 47 C;
    # the upper end allows isoform/buffer spread. TIGHTENED from the melt config's [45, 58] to the enzyme
    # the plan actually names -- which makes the constraint on the temperature box STRICTER, not looser.
    # A NUISANCE here: drawn, never predicted, and inert because the box sits below it.
    T_melting: [40.0, 50.0]

  # ---------------------------------------------------------------------------------------------
  # Numerics: the resolution of each numerical procedure. None of these change the physics -- they
  # decide how accurately it is computed -- and each is re-measured for THIS rate law
  # (scripts/validate_mm.py), never inherited from config/detector/enzyme.yaml.
  # ---------------------------------------------------------------------------------------------
  # The guard that makes "below the melt" a checked fact rather than a claim: the detector refuses to
  # build if the folded fraction dips below this anywhere in temperature_bounds x the
  # (delta_H, delta_C, T_melting) prior. The plan's own requirement is > 0.98.
  min_folded_fraction: 0.98
  # Trapezoid nodes for the calibration's tau = int_0^x_half dx/rate. The calibration is a quadrature
  # over the EXTENT, not a time integration, so this is its only resolution knob. Unchanged from the
  # melt config, where 33 nodes were already well inside the read-out precision.
  n_quadrature: 33
  # RKC2 steps per read-out interval, so 8 * 80 = 640 steps per experiment, dt = 1.5625e-3 h.
  # RE-MEASURED for this rate law, not inherited: scripts/validate_mm.py --mode steps compares the
  # shipped float32 chain against an INDEPENDENT float64 numpy implementation of the same scheme. The
  # true error is minimised near this step -- below it truncation dominates, above it float32 roundoff
  # in the Chebyshev recursion costs more than the shorter step buys (which is also why the dt/dt-half
  # guard RISES with step count and must not be believed on its own).
  n_steps_per_measurement: 80
  # RKC2 stages per step: the scheme spends s rate evaluations to push a damped Chebyshev polynomial
  # along the negative real axis, so its stability boundary grows like s^2 instead of Euler's fixed 2.
  # The boundary is MEASURED in float32 on the target device (validate_mm.py --mode stability), and
  # stability is not the binding constraint here -- accuracy is.
  n_stages: 5
  # Verwer's damping epsilon = 2/13. It lifts |R(z)| off 1 between the polynomial's extrema, turning the
  # bare Chebyshev scheme's tangency into a strip of genuine stability.
  damping: 0.153846
  # Guard threshold, in mM, on the error the solve estimates for ITSELF: every integration runs a dt and
  # a dt/2 chain and reports max|fine - coarse|, and __call__ raises if that exceeds this. Set to 10% of
  # the read-out noise (0.05 mM) -- the integration must not disturb what the read-out itself resolves.
  integration_tolerance: 5.0e-4   # 10% of measurement_noise 0.005 (repo-wide rule; provenance-mm.md line 143)
