straw:
  # Structural counts (NO nominal design; the design is supplied per-call)
  n_stations: 4
  n_views_per_station: 4
  n_layers_per_view: 2
  n_straws_per_layer: 200

  # Straw geometry
  straw_length: 400.0 # cm
  straw_pitch: 2.0 # cm (centre-to-centre in a layer)
  layer_y_offset: 1.0 # cm (half-pitch y-stagger between the two layers in a view)

  # Physics parameters
  dt: 0.1 #ns
  max_B: 0.20 # Tesla; peak |Bx| of the FairShip V13_3500 spectrometer field map (on-axis)
  z0: 8957.0 # Center of magnetic field (cm) = FairShip magnet centre (geometry_config c.z = 89.57 m, map z_local=0)
  B_sigma: 286.0 # cm; our-form width fit to V13_3500 Bx(z) on-axis (int Bx dz ~ 1.05 T.m)
  layer_bounds: [8200., 9750.] # Valid range for layer z-positions (mm), should encompass all stations
  max_particles: 2 # Accommodate all daughter particles from HNL decay
  # Data loading
  data_dir: "selected_data" # "combined_tof"

  # Target normalization (decay_mean/decay_sigma, momentum_mean/momentum_sigma)
  # defaults to data-derived values; omit to use the StrawDetector defaults / data.
