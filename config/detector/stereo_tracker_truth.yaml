# Same geometry as `stereo`, but the StereoTrackerTruth detector: __call__ records each track's plane
# crossings and returns a StrawEvent with the per-hit (x, y) / drift_r / matched-tdc TRUTH (for the
# tracker experiments in scripts/tracking.py). The production `stereo` detector stays a clean fired-straw
# event -- the per-hit truth lives ONLY here, not behind flags on the main path.
stereo_tracker_truth:
  n_stations_upstream: 2
  n_stations_downstream: 2
  n_layers_per_view: 2
  n_straws_per_layer: 316
  straw_length: 400.0
  straw_pitch: 2.0
  layer_z_gap: 1.732
  view_z_gap: 5.0
  magnet_half_cm: 140.0   # magnet z half-width (FairShip YokeDepth)
  station_width: 100.0    # station z full-width (2 x FairShip station_length); coupled non-overlap encoding
  station_clearance: 50.0 # minimum z gap between adjacent station footprints (0 = may touch)
  field_integral: -1.069    # FairShip V2023 polarity; int Bx dz = -1.07 T.m with B_sigma=208
  z0: 8957.0
  B_sigma: 208.0
  layer_bounds: [ 8200.0, 9750.0 ]
  max_particles: 1024
  max_hits_per_event: 128
  max_dt: 1.0
  max_time: 300.0
  material: kapton
  data_dir: "data/mc-reco"
