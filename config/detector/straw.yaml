straw:
  # Station z-positions (cm)
  station_z: [8407.0, 8607.0, 9307.0, 9507.0]
  n_views_per_station: 4
  n_layers_per_view: 2
  n_straws_per_layer: 200

  # Straw geometry
  straw_length: 400.0 # cm
  straw_pitch: 2.0 # cm (centre-to-centre in a layer)
  layer_x_offset: 1.0 # cm (Layer-2 vs Layer-1 x-offset)

  # View geometry
  view_angles: [0.0, 0.0798, -0.0798, 0.0] # X, U, X', V (radians, stereo angle = 4.57°)
  layer_z_gap: 1.732 # cm (between layers in a view)
  view_z_gap: 5.0 # cm (between consecutive views)

  # Physics parameters
  dt: 0.1 #ns
  max_B: 0.15 # Tesla (maximum magnetic field strength for optimization)
  z0: 8957.0 # Center of magnetic field (cm)
  B_sigma: 300.0 # Sigma (width) of magnetic field (cm)
  layer_bounds: [8200., 9750.] # Valid range for layer z-positions (mm), should encompass all stations
  max_particles: 50 # Accommodate all daughter particles from HNL decay
  p_spawn_single: 0.0
  p_spawn_pair: 0.0
  E_sec_MeV: 0.01
  # Data loading
  data_dir: "selected_data" # "combined_tof"


  # Loss function parameters for HNL reconstruction
  # NOTE: Normalization now uses target_mean and target_std computed from data
  # The scales below are kept for backward compatibility but not used in loss
