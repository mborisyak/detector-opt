straw:
  n_stations: 4
  n_views_per_station: 4
  n_layers_per_view: 2
  n_straws_per_layer: 200
  straw_pitch: 2.0
  straw_length: 400.0
  layer_y_offset: 1.0
  max_B: 0.15
  z0: 8957.0
  B_sigma: 300.0
  layer_bounds: [8200.0, 9750.0]
  dt: 0.1
  max_particles: 2
  # Target-normalization constants (decay_mean/decay_sigma, momentum_mean/momentum_sigma)
  # default to data-derived values; omit to use the StrawDetector defaults / data.

# Nominal (initial/baseline) design -- NOT detector state. Lives in config and is
# read by scripts to build a concrete design via detopt.detector.free_design_array.
nominal_design:
  station_z: [8407.0, 8607.0, 9307.0, 9507.0]
  view_angles: [0.0, 0.0798, -0.0798, 0.0]
  view_z_gap: 5.0
  layer_z_gap: 1.732
  B: 0.15