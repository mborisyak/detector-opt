# Geometry taken from FairShip SST (FairShip/geometry/strawtubes_config.yaml +
# geometry_config.py): 4 stations [0,+a,-a,0] views x 2 layers, straws along x.
straw:
  n_stations: 4
  n_views_per_station: 4
  n_layers_per_view: 2
  n_straws_per_layer: 316  # FairShip SST V2023 straws per layer (digi_straw index 1..316); 2 cm pitch -> |y| up to 316 cm
  straw_pitch: 2.0         # FairShip straw_pitch (cm)
  straw_length: 400.0      # FairShip aperture width 200 cm (half) -> 400 cm straws (x)
  # layer_y_offset is derived (= straw_pitch / 2 = straw radius); not a config knob.
  wall_thickness: 0.0036   # FairShip straw wall thickness (cm)
  max_B: -0.151  # T; on-axis peak Bx of FairShip MainSpectrometerField.root (negative polarity)
  z0: 8957.0     # cm; spectrometer magnet centre (FairShip c.z = 89.57 m)
  B_sigma: 283.0  # cm; proper-Gaussian std-dev matched to MainSpectrometerField on-axis Bx(z) (int Bx dz ~ -1.07 T.m)
  layer_bounds: [8200.0, 9750.0]
  dt: 0.1
  max_particles: 1024  # DEBUG-only (sizes the trajectory/tree slots; ~2x the MC 99th-pct particles/event); does NOT gate hits or input
  max_hits_per_event: 384  # NN-facing per-event hit cap (solver emits the M earliest-TDC straws)
  # Target-normalization constants (decay_mean/decay_sigma, momentum_mean/momentum_sigma)
  # default to data-derived values; omit to use the StrawDetector defaults / data.
# Nominal (initial/baseline) design lives in config/detector/nominal_design.yaml so this
# file stays a single {name: args} detector config consumable by utils.config.extract.