# MM-SYM at m = 3 with Q10_cat REMOVED FROM THE TARGET. Delta-config against
# `config/detector/enzyme_mm_sym_m3.yaml`: `target_parameters` drops `Q10_cat`, nothing else moves.
#
# WHY. Over the 47 re-scored points of the completed 2^19 campaign
# (`output/cloud-mm-p5e3/*/*/*/verification.json`) the per-component held-out loss for `Q10_cat` sits
# at its 1/3 prior on 42 of 47 designs, and the 5 that move it are exactly the 5 lowest total losses
# on record. That makes the shipped objective a STEP -- cracking `Q10_cat` is worth ~0.05 of loss and
# happens on a small minority of designs -- rather than the smooth interior optimum
# `docs/task-mm-recovery.md` section 2 assumed. The parent gate's own Fisher analysis reported
# posterior variances 0.026 / 0.019 / 0.223 for the three coefficients and was never redone for the
# shipped configuration.
#
# WHAT DROPPING IT DOES, measured on those same 47 points before this file was written: the objective
# does NOT go flat, which was the risk. Discrimination in units of the held-out error RISES (range /
# median test_sem 327 against 296), the two objectives rank designs almost identically (Spearman
# 0.979, Kendall 0.932), and the step survives and grows (largest sorted gap 77 sem against 63). What
# does change is WHICH designs are best: only 2 of the top 5 are shared, so the optimum moves and this
# is a different task, not a cleaner view of the same one.
#
# m STAYS AT 3 although p is now 2. This DEPARTS from the `m ~ p` structural rule the parent file
# argues for, and is a deliberate minimal-change choice so the design space, the design dimension (12)
# and the kernel's `exchangeable: 3` are identical to the campaign this is compared against. The batch
# is redundant by the task's own rule; that is a known cost of the comparison, not an oversight.

enzyme_mm:
  n_experiments: 3
  n_measurements: 16
  concentration_E: 8.0e-5
  duration: 1.0
  measurement_noise: 0.05
  concentration_A_bounds: [0.01, 10.0]
  concentration_B_bounds: [0.01, 10.0]
  enzyme_fraction_bounds: [0.01, 1.0]
  temperature_bounds: [10.0, 35.0]
  target_parameters: [log_K_A, log_K_B]
  calibration_concentration_A: 0.3162
  calibration_concentration_B: 0.3162
  calibration_fraction: 0.1
  calibration_temperature: 25.0
  half_time_bounds: [0.25, 2.0]
  parameters:
    log_K_A: [-2.3, 0.0]
    Q10_A: [0.7, 2.0]
    log_K_B: [-2.3, 0.0]
    Q10_B: [0.7, 2.0]
    log_Ki_C: [-3.91, -1.61]
    Q10_C: [0.7, 2.0]
    log_Ki_D: [-1.2, 1.1]
    Q10_D: [0.7, 2.0]
    Q10_cat: [1.8, 2.6]
    delta_H: [1.2e5, 2.1e5]
    delta_C: [2.5e3, 4.5e3]
    T_melting: [40.0, 50.0]
  min_folded_fraction: 0.98
  n_quadrature: 33
  n_steps_per_measurement: 160
  n_stages: 5
  damping: 0.153846
  integration_tolerance: 0.0125
