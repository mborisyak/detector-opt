# ⚠️ VARIANT of `config/linear_d3n4.yaml`: `training.n0` 4096 -> 1024 and `training.n_increment`
# 4096 -> 512. Nothing else moves.
#
# WHY. A design cannot cost less than `n0 * (1 + val_fraction/(1 - val_fraction))`, so at n0 = 4096 the
# floor was 5,461 detector calls -- 4.2% of the whole 131,072 budget -- and spend was quantised to
# multiples of it. MEASURED on the completed campaigns: 75% of designs in `linear-d3n4-revealed` and
# 67% in `linear-set-onehot` exited at the FIRST window, so their true requirement was at most 5,461
# and otherwise unobserved. Per-design cost was censored from below for the majority of designs, and
# two designs needing 800 and 3,000 calls were recorded identically.
#
# At n0 = 1024 the floor is 1,365 (96 designs per budget instead of 24) and the increment is 683, so
# the procedure can resolve what a design actually needed instead of clipping it.
#
# ⚠️ `iteration_limit` is deliberately NOT rescaled. It sets `steps_per_epoch = iteration_limit //
# batch` = 512, independent of the window, so the first window now sees 64 passes per epoch where it
# saw 16. That is a real change to the early-window regime, not a pure accounting fix; it is accepted
# here because the alternative -- moving `iteration_limit` -- would silently redefine what an epoch is
# and break comparability with everything measured on this task.

# LINEAR at d = 3 with n_probes = 4, GROWTH procedure, short run.
#
# Delta against `config/linear.yaml`: `detector` -> `linear_d3n4` (3 dimensions, 4 probes, noise 0.5,
# 12 design coordinates) and `budget` 1048576 -> 131072. Nothing else moves.
#
# WHY 131072. At the shipped bar of 2.0e-2 a `linear` design costs a MEASURED median 6512 detector
# calls over 8 runs, so 131072 buys roughly 20 designs -- the run length asked for. The count is a
# consequence of the bar, not a setting: this procedure grows each design's window until
# `diff + err <= loss_precision` and stops when the shared budget is spent.
#
# n_probes = n_dimensions + 1 is the structural rule for this family, and `config/detector/
# linear_d3n4.yaml` follows it. The design is 12-dimensional, so BO has a real search here, unlike
# the shipped d = 1 cell where every arm reaches the exact closed-form optimum by design 20 and sits
# there.
#
# `exchangeable: 4`, NOT the parent's 2. The design is a SET of probes and the invariant kernel
# quotients the permutation symmetry, so the value must equal `n_probes` -- 4 here. Inheriting the
# parent's 2 raises `no design field of length 2 to permute` at the first GP fit.
#
# THE POINT OF THIS RUN is the step-0 initialisation change: `design_init_sequence` now roots every
# arm's first network in ONE sequence off the run seed, so `from_scratch`, `continue`, `closest` and
# `meta` begin design 0 from bit-identical weights (verified: max|diff| 0.0 over 21992 parameters).
# Design 0 was already the one design where the continual arm's replay is inert -- at `start == 0`
# both halves of its batch come from the current window -- so with initialisation matched too, the
# first design is now a genuinely matched comparison across all four arms.

detector: linear_d3n4

regressor:
  set-regressor:
    features: [[24, 32], [32, 24]]
    n_models: 4

device: cuda
plot_per_epoch: 8

training:
  n0: 1024
  n_increment: 512
  batch: 128
  eval_batch: 4096
  warmup_epochs: 2
  patience: 16
  budget: 131072
  iteration_limit: 65536
  val_fraction: 0.25
  loss_precision: 2.0e-2
  param_mix: 0.25
  optimizer:
    adamaxw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      normalised-invariant-rbf:
        exchangeable: 4
  ei:
    n_restarts: 32
    n_steps: 100

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
