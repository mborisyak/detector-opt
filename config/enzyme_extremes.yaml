# RUN config for the BINARY EXTREMES candidate (detector: config/detector/enzyme_extremes.yaml).
# The detector config says what the system IS; this says how a benchmark run is conducted on it.
#
#   ./scripts/campaign.sh enzyme_extremes output/campaign-extremes 5 meta from_scratch
#
# It is config/enzyme_inhib.yaml with ONE field changed -- `detector` -- because the binary task
# differs from the three-class one ONLY in which mechanism classes the compound library contains, and
# that (`mechanism_classes`) lives in the DETECTOR config, not here. Everything below is therefore the
# three-class run config verbatim, and the two numbers inherited from the three-class chemistry are
# labelled as inherited where they appear.
#
# THE TARGET IS A CLASS, not a number. The network emits 2 logits and the detector's own loss is
# softmax cross-entropy divided by ln 2, so the no-information level is EXACTLY 1.0 on every sample
# rather than a measured target variance -- and the `ln n_classes` division is what keeps the binary
# and the three-class losses on the SAME scale (output/screen/provenance-extremes.md section 3). That
# is what makes criterion (d) reachable here: the bar `10 * loss_precision` is compared against a
# baseline-to-best range that starts at 1.0, whereas on the growth candidate the whole range was
# 0.036 and the same bar was unsatisfiable by construction.
detector: enzyme_extremes

regressor:
  # A deep set over the batch: one ELEMENT per experiment, its features being that experiment's
  # read-outs followed by its own design coordinates, so the network is design-conditioned and the
  # inference is permutation-invariant in the experiments -- the symmetry of the problem.
  set-regressor:
    features: [[24, 16], [16, 24]]
    n_models: 4      # ensemble: independent members, averaged at evaluation
    p_dropout: 0.1   # measured on the melt task: costs 0.0067 of level, buys a 5.3x cheaper exit

device: cuda

# The per-epoch diagnostic figure (`plot_iteration`, one full matplotlib render per EPOCH on a
# background worker, with the design blocking on that queue at exit) is OFF here. MEASURED on this
# task it is host-side CPU work done after the network has already converged, and on a shared node it
# comes straight off the CPU-bound screening jobs. The end-of-iteration convergence plot and every
# other output are unaffected; nothing that a result is read from is lost. Set it to `true` to get
# the per-epoch curves back when a design needs diagnosing.
plot_per_epoch: false

training:
  n0: 2048
  n_increment: 1024
  batch: 256
  eval_batch: 2048
  warmup_epochs: 4              # A SAFEGUARD, not a tuning knob: it only stops the procedure
                                # acting before there is anything to act on. Small on purpose --
                                # the settled-test is a POSTERIOR, so an unsettled early curve
                                # already fails it through its own width. 2-4.
  budget: 2097152                # INHERITED from enzyme_inhib.yaml: ~35-45 designs at the spend MEASURED
                                 # THERE (three-class). The binary per-design spend is measured separately
                                 # and this number is sized against it before the campaign is launched.
  iteration_limit: 131072        # the epoch length (iteration_limit // batch steps) and the per-design
                                 # window cap; MEASURED on the three-class task (at precision 8.0e-3 its
                                 # crash case, diff+err 0.00748, converges inside it), INHERITED here
  val_fraction: 0.25
  loss_precision: 8.0e-3         # INHERITED from addendum-inhibitor-precision.md, where it is the MEASURED
                                 # feasibility floor of the THREE-CLASS chemistry. It has never been measured
                                 # on the binary task; docs/tuning-preregistration.md section 5 requires it be
                                 # measured (max over >= 8 designs x >= 2 seeds) before the binary verdict is
                                 # claimed. Changing it is a new pre-registration, declared BEFORE the campaign.
  patience: 32                  # The horizon over which the loss must be STILL. Requiring N
                                # epochs of stillness IS how the procedure waits for the
                                # regressor's BIAS to disappear, so it must be long enough that
                                # "still" means "the bias has finished moving" and not merely
                                # "the noise was quiet". 16-32, scaling with `iteration_limit`,
                                # which sets how much optimisation one epoch contains.
  optimizer:
    adamw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-6

bo:
  n_init: 5          # the user's criterion is stated for "BO with 5 initial Sobol points"
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      normalised-invariant-rbf:
        exchangeable: 4   # = n_experiments: the batch is a SET

  ei:
    n_restarts: 32
    n_steps: 100

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
