detector:
  debug: {}

regressor:
  set-regressor:
    features:
      - [64, 64]
      - [64, 32]
    p_dropout: 0.1   # regularization -> shrinks the train/val overfitting gap

device: cuda

training:
  n0: 2048
  n_increment: 1024
  iteration_limit: 131072  # per-design upper limit (also sets epoch = iteration_limit/batch)
  batch: 256
  # Gradient-free evaluation batch for the sequential train+val loss passes
  # (no backprop, so it can exceed the training batch).
  eval_batch: 2048
  warmup_epochs: 10
  # Shared detector-call budget for the WHOLE BO run (train+val events across all
  # networks). When it can't supply the next sample the design returns early and
  # the BO loop finishes.
  budget: 1048576
  # Convergence: "converged" = warmup elapsed AND the *training* loss plateaued
  # (per-epoch slope within flatness_tol) for `patience` epochs. Add data after
  # warmup if the gap is confidently > precision, or once converged if
  # |val-train| + err >= precision; accept when converged and < precision.
  flatness_tol: 1.0e-2
  loss_precision: 1.0e-2
  patience: 10
  optimizer:
    adamw:
      learning_rate: 1.0e-3
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

bo:
  n_init: 4
  gp:
    n_folds: 5
    n_restarts: 4
    n_steps: 30
    log_lengthscale_prior_bounds: [ -2.0, 1.0 ]
    log_amplitude_prior_bounds: [ -3.0, 1.0 ]
  ei:
    n_restarts: 16
    n_steps: 60

seed: 0
output: output/bo_debug
