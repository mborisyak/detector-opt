# MM WITHOUT Q10_cat: 1 seed x 4 strategies, budget 2^18, bar 3.0e-3, dropout in place of dropconnect.
#
# Detector `enzyme_mm_sym_m3_nq` -- target is [log_K_A, log_K_B] only; see that file for why Q10_cat
# was dropped and for the measurement (47 re-scored points) showing the objective stays discriminative
# without it. m stays at 3, so the design space and `exchangeable: 3` match the campaign this is
# compared against.
#
# loss_precision: 3.0e-3, NOT the 1.0e-3 first considered. The gate is `gap + err <= bar` with
# `err = c / sqrt(window)` and c measured at 0.307 on this task, so a 1.0e-3 bar needs >= 94249 events
# per design -- 2.8 designs inside a 2^18 budget, against n_init = 5. Worse, the measured `gap` regimes
# are 0.0005 (seed 1) and 0.0024 (seed 2), so at a 1.0e-3 bar a seed-2-regime design has `gap` ALONE
# above the bar and can never satisfy the gate however much data it buys. 3.0e-3 implies ~10472 events
# per design, ~25 designs in budget, and sits above both measured gap regimes.
#
# dropconnect 0.05 -> p_dropout 0.1. The `set-regressor` block order is linear -> activation -> dropout,
# so dropout acts on ACTIVATIONS ONLY and never on a block's input; the raw detector features are not
# dropped. (`detopt/nn/mlp.py` is the opposite -- it inserts Dropout BEFORE every linear including the
# first -- but nothing here uses it.)
#
# EVERY MM NUMBER ON DISK was taken at dropconnect 0.1, so this run is not comparable to them on the
# regulariser axis either. It is a fresh baseline, not a continuation.

detector: enzyme_mm_sym_m3_nq

regressor:
  set-regressor:
    features: [[24, 16], [16, 24]]
    n_models: 4
    p_dropout: 0.1
device: cuda
plot_per_epoch: 8

training:
  n0: 2048
  n_increment: 1024
  batch: 128
  eval_batch: 2048
  warmup_epochs: 2
  patience: 16
  budget: 262144
  iteration_limit: 65536
  val_fraction: 0.25
  loss_precision: 3.0e-3
  param_mix: 0.25
  optimizer:
    adamaxw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      normalised-invariant-rbf:
        exchangeable: 3
  ei:
    n_restarts: 32
    n_steps: 100

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
