# ⚠️ REHEARSAL ONLY -- NOT A CANDIDATE CONFIG, NOT A RESULT. DELETE WHEN THE DRESS REHEARSAL IS DONE.
#
# Second toy campaign. `config/_rehearsal_extremes.yaml` (the shipped `loss_precision`, 8x smaller
# budget) reproduces the campaign's real per-design cost -- ~82k calls for `from_scratch` -- and
# therefore stops at 2-3 designs, BELOW `bo.n_init = 5`. A run that never leaves the Sobol block
# never fits a GP and never maximises EI, so that campaign cannot exercise the acquisition path, and
# `--compare-arms-at 3` has nothing to cut.
#
# This one buys designs by RELAXING `loss_precision` -- the one knob the rehearsal brief permits to
# be relaxed, and only for the rehearsal. 2.0e-2 is config/bo.yaml's melt value; it lets a design
# stop far earlier, so the same budget buys many more of them.
#
# ⛔️ EVERY LOSS PRODUCED UNDER THIS CONFIG IS MEANINGLESS AS A MEASUREMENT. At this precision a
# design stops while its estimate is still 2.5x coarser than the campaign's, and the budget is 8x
# short. It exists to make the BO loop take the GP+EI branch and to give the arm comparison enough
# designs to cut, nothing else. No number from it may be reported about the binary-extremes task.
detector: enzyme_extremes

regressor:
  set-regressor:
    features: [[24, 16], [16, 24]]
    n_models: 4
    p_dropout: 0.1

device: cuda

plot_per_epoch: 8

training:
  n0: 2048
  n_increment: 1024
  batch: 256
  eval_batch: 2048
  warmup_epochs: 4               # A SAFEGUARD, not a tuning knob: it only stops the procedure
                                # acting before there is anything to act on. Small on purpose --
                                # the settled-test is a POSTERIOR, so an unsettled early curve
                                # already fails it through its own width. 2-4.
  budget: 262144                 # REHEARSAL: 2097152 / 8
  iteration_limit: 131072
  val_fraction: 0.25
  loss_precision: 2.0e-2         # REHEARSAL ONLY -- relaxed from the shipped 8.0e-3 to buy designs
  patience: 32                  # The horizon over which the loss must be STILL. Requiring N
                                # epochs of stillness IS how the procedure waits for the
                                # regressor's BIAS to disappear, so it must be long enough that
                                # "still" means "the bias has finished moving" and not merely
                                # "the noise was quiet". 16-32, scaling with `iteration_limit`,
                                # which sets how much optimisation one epoch contains.
  optimizer:
    adamaxw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3
bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      normalised-invariant-rbf:
        exchangeable: 4

  ei:
    n_restarts: 32
    n_steps: 100

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
