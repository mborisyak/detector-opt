# 2M-BUDGET variant of `ship_angle_prec1e2_w2x.yaml`. EXACTLY ONE KEY DIFFERS -- training.budget
# 1048576 -> 2097152 -- matching how `ship_addr_prec1e2_w2x_2m.yaml` relates to its own 1M parent,
# so a cell here is directly comparable to the banked `ship-angle-w2x` cells at double the spend.
#
# `iteration_limit` is DELIBERATELY UNCHANGED at 262144 (a per-design cap of 349525 calls). At w2x
# width and 2M budget the banked `ship-addr-w2x-2m` corpus hit that cap on 2 of 222 designs (0.9%),
# both in per-design arms; `meta` and `closest` never did. Raising it would also raise the EPOCH
# (steps_per_epoch = iteration_limit // batch), so it is not a free knob and is not turned here.
#
# The n0/n_increment ladder (16384/8192) was checked against the 1M runs before this was submitted:
# over 289 banked designs NO design converged at the n0 floor (21845 calls); the cheapest anywhere
# was 32768 and meta's cheapest at w2x width was 65537, so the ladder is not censoring meta's
# consumption from below.
#
# Variant of `config/ship_addr_prec1e2_w2x.yaml`. The NETWORK is untouched (w2x widths
# [[32,48],[48,32]], budget 1048576, loss_precision 1.0e-2); what changes is the DETECTOR, and with
# it the design space:
#
#   stereo_address_design -> angle_only        design_dim 5 -> 1
#
# THE STATIONS ARE FIXED AT THE 1M OPTIMUM AND ARE NO LONGER A DOF. `fixed_stations` is the best
# design of the whole `ship-addr-prec1e2` corpus (673 banked designs over 70 cells): loss 0.26710 at
# seed 126382657, arm `meta`, iteration 12. The top THREE designs of that corpus share this exact
# placement and differ only in the angle, so it is not a single lucky draw.
#
# ⚠️ IT IS A CORNER OF THAT CAMPAIGN'S BOX, NOT AN INTERIOR OPTIMUM. 8325 and 8767 are the lower and
# upper limits of the upstream window, 9600 and 9700 the two downstream limits: the search pushed the
# stations as far apart as it was allowed on both sides of the magnet and stopped at the bound. The
# placement is therefore the best AVAILABLE one, and a wider box could well be better.
#
# The angle is searched over BOTH SIGNS, (-angle_max, +angle_max), instead of the (0, angle_max) the
# station-plus-angle designs use. THE TWO SIGNS ARE NOT EQUIVALENT. The view pattern [0, +a, -a, 0]
# alone would make a sign flip a reflection, but two things break it: the magnet bends tracks in a
# DEFINITE direction (the field is signed, int Bx dz < 0), and the half-pitch wire stagger is keyed to
# layer PARITY, so +a and -a sample a bent trajectory differently. Expect the objective to be roughly
# but not exactly even in the angle -- and note that a few designs per cell cannot resolve the
# difference, so do not read a sign preference off one run.

detector:
  angle_only:
    n_stations_upstream: 2    # stations upstream of the magnet (z < z0)
    n_stations_downstream: 2  # stations downstream of the magnet (z > z0)
    n_layers_per_view: 2
    n_straws_per_layer: 316  # FairShip SST V2023 straws per layer (digi_straw index 1..316); 2 cm pitch -> |y| <= 316 cm
    straw_length: 400.0
    straw_pitch: 2.0
    layer_z_gap: 1.732
    view_z_gap: 5.0
    magnet_half_cm: 140.0  # exclude the spectrometer magnet (FairShip YokeDepth 1.4 m) from station bounds
    field_integral: -1.071 # T.m, int Bx dz (FairShip MainSpectrometerField, negative polarity; -0.151 T peak derived w/ B_sigma=283)
    z0: 8957.0             # magnet centre (FairShip c.z = 89.57 m, map z_local=0)
    B_sigma: 283.0         # cm; proper-Gaussian std-dev matched to MainSpectrometerField on-axis Bx(z) (int Bx dz ~ -1.07 T.m)
    layer_bounds: [8275.0, 9750.0]
    max_particles: 1024    # DEBUG-only now (trajectory/tree slots); does not gate hits or input
    max_hits_per_event: 128  # NN-facing per-event hit cap (solver emits the M earliest-TDC straws)
    max_dt: 1.0
    max_time: 300.0
    material: kapton
    data_dir: "data/mc/numpy_newFS"  # ~4.31M events across 996 files (verified 2026-08-18); boundary crossings are upstream of the magnet (magnet-independent)

    fixed_stations: [8325.0, 8767.0, 9600.0, 9700.0]
    stereo_bound: [-0.2, 0.2]

# Nominal (initial/baseline) design -- NOT detector state. A named physical-design dict the
# detector scales via to_scaled (BO itself seeds from random proposals).
nominal_design:
  view_angle: 0.0798

regressor:
  set-regressor:
    features: [[32, 48], [48, 32]]
    n_models: null
    p_dropout: null
    activation: celu

device: cuda
plot_per_epoch: 8

### target 10+ steps
training:
  n0: 16384
  n_increment: 8192
  batch: 256
  # Gradient-free evaluation batch for the sequential train+val loss passes
  # (no backprop, so it can exceed the training batch).
  eval_batch: 2048
  # Mandatory unconditional epochs after every data addition.
  warmup_epochs: 4               # A SAFEGUARD, not a tuning knob: it only stops the procedure
                                # acting before there is anything to act on. Small on purpose --
                                # the settled-test is a POSTERIOR, so an unsettled early curve
                                # already fails it through its own width. 2-4.
  # Extended shared detector-call budget for the whole BO run.
  budget: 2097152
  # Per-design upper limit on data (also sets epoch = iteration_limit / batch).
  iteration_limit: 262144

  val_fraction: 0.25
  # Convergence: per-epoch-slope flatness tol, target loss precision, plateau window.
  loss_precision: 1.0e-2
  patience: 32                  # The horizon over which the loss must be STILL. Requiring N
                                # epochs of stillness IS how the procedure waits for the
                                # regressor's BIAS to disappear, so it must be long enough that
                                # "still" means "the bias has finished moving" and not merely
                                # "the noise was quiet". 16-32, scaling with `iteration_limit`,
                                # which sets how much optimisation one epoch contains.
  replay_weight: 0.25
  param_mix: 0.1
  optimizer:
    adamaxw:
      learning_rate: 5.0e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3
# Independent trajectory verification (scripts/verify_trajectory.py): re-score <= n_points designs
# of a finished run's results.json (uniform in cumulative detector calls, always the last) on a
# 6:2:2 train/val/test split; best-val network scored once on the held-out test buffer.
verify:
  n_points: 5
  epochs: 64
  val_every_epochs: 1
  eval_batch: 1024
  sample_batch: 1024

bo:
  # No fixed iteration count -- the run continues until the shared detector-call
  # `budget` is exhausted. Initial random proposals = gp.n_folds (set in bo.py).
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    # Lengthscales are read against the UNIT cube, so l = 1 already spans the whole
    # domain. The old ceiling of 1.5 (l = 4.5) was calibrated when the searched box
    # was the encoded [-3, 3]^d; on the scaled cube it pins uninformative dimensions
    # at the bound instead of letting ARD switch them OFF (which needs l >> 1).
    # 4.0 gives l = 54.6 -- effectively inert -- while the floor still forbids a
    # degenerate white-noise fit. Matches config/enzyme.yaml.
    log_lengthscale_prior_bounds: [-6.0, 4.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    # Ordinary per-coordinate ARD: this design has NO exchangeable element. A layer's wire stagger
    # is keyed to its index parity, so permuting layers is a different detector; and the stereo
    # stations are already ordered by their coupled sequential window, so the relabelling symmetry
    # is removed by the parameterisation rather than left for the kernel.
    #
    # AN INVARIANT KERNEL IS NOT AN OPTION HERE, and the reason is worth writing down because
    # `config/enzyme.yaml` selects one and the two designs look superficially alike. Both invariant
    # families (sorting, group average) would have to act on the SCALED coordinates the GP sees, and
    # `_to_nominal_flat` (stereo_straw.py:263) makes those conditional: u_k is the fraction of the
    # window REMAINING after station k-1, with the window reset at the magnet, so u_1 and u_2 are not
    # commensurable quantities and slots 0-1 live upstream of the magnet while 2-3 live downstream.
    # Measured on 2000 uniform draws at this config: the nominal stations come out strictly
    # increasing in EVERY draw (slot ranges [8250, 8667], [8374, 8767], [9147, 9600], [9259, 9700]),
    # and sorting the u's moves the physical design by a median 175 cm, max 437 cm, leaving it
    # unchanged in 64/2000. So sorting is the IDENTITY in the space where it would mean something
    # (the nominal z's, already ordered) and asserts a false equality in the space it would act on.
    # A genuine set symmetry here needs the map to change first -- independent per-station z on a
    # global range, ordering left to the solver, as `free_straw` does with its 32 `layer_z` (the C
    # solver sorts layers by z before propagating, straw_detector.c:589, so a 32! redundancy IS
    # unmodelled there and an invariant kernel would have something real to quotient).
    kernel:
      ard-rbf: {}

  ei:
    n_restarts: 32
    n_steps: 100

# Warm-start each network from the nearest previously trained design.
nn_init_strategy: closest