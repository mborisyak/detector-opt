# WINDOWS 2026-09-06: `training.n0` 4096 and `training.n_increment` 2048 on EVERY rung, regressor activation `celu`,
# `iteration_limit` 262144, `budget` 524288, `warmup_epochs` 16 (user, 2026-09-06: no exit test before the 16-epoch
# cosine has reached its floor). The paragraphs below that argue for 512/256 or 1024/512 describe the adamaxw era and are
# SUPERSEDED: under adamw + cosine a window grown from a few hundred rows accumulates training optimism
# (2 sigma^2 p_eff / N over thousands of epochs) and never meets the 0.02 bar before ~140k rows, while a 4096 first
# window converges designs at 8k-47k rows with the reported loss on the closed-form Bayes risk. Measured on d2n3 /
# seed 160541601; probes and figure in output/archive/probe-linear-ladder-2026-09-05/, record in docs/handoff-2026-09-04b.md §9.
#
# THE ARM AND ITS TRAINING REGIME ARE NOT IN THIS FILE. They live in `config/strategy/`, shared
# across the whole ladder (one selection, not one per rung), and named on the command line:
#
#     python scripts/bo.py =linear_d4n5 strategy=linear-meta-sp-l06-s1e2 output=... seed=...
#
# `scripts/bo.py` raises if this file also sets `nn_init_strategy` or a retention knob.
strategy: linear-from_scratch-norewind
# ⚠️ SIBLING of `config/linear_d3n4.yaml` at the TOP of the dimension ladder. Two keys differ:
# `detector` -> `linear_d4n5_s05` (4 dimensions, 5 probes, noise 0.5, 20 design coordinates) and
# `bo.gp.kernel.normalised-invariant-rbf.exchangeable` 4 -> 5. Training, budget, regressor and BO
# settings are byte-identical to the d3n4 rung, which is the completed 20-seed campaign, so the two
# are directly comparable.
#
# `n0` 1024 / `n_increment` 512 are NOT reduced to the 512/256 the small rungs were moved to. The
# reduction there answered a censoring problem: 26% of d1n2 designs exited at the very first window.
# Designs cost MORE as the design space grows, so the larger cell is the less censored one -- d3n4
# measured 24% at the floor and this rung should be lower still. Keeping 1024/512 also preserves
# byte-identity with the d3n4 campaign.
#
# ⚠️ `budget` 262144, TWICE the 131072 every other linear campaign ran at. This rung has 20 design
# coordinates against the d3n4 rung's 12, and the analytic scan of the same cell
# (`output/linear-exact-d4n5`) shows the incumbent still stepping down at design 40 without reaching
# the optimum 0.052464 -- so the search is not finished at the old budget and a cell there would be
# measuring the cut-off rather than the arm.
#
# `iteration_limit` STAYS at 65536 and that is now `budget / 4`, the settled default, where at the old
# budget it was `budget / 2`. So the doubling leaves `steps_per_epoch = iteration_limit // batch` = 512
# unchanged -- the epoch means the same thing here as on every other rung -- while bringing the ratio
# INTO line with the default rather than away from it.
#
# ⚠️ NOT byte-identical to `config/linear_d3n4.yaml` any more: three keys differ (`detector`,
# `exchangeable`, `budget`). A spend comparison against the d3n4 campaign is still valid because the
# x axis is detector calls, but a "designs per cell" comparison is not.

# `exchangeable` MUST equal `n_probes`. The design is a SET of probes and the invariant kernel
# quotients that permutation symmetry; a mismatched value raises `no design field of length <n> to
# permute` at the first GP fit.

detector: linear_d4n5_s05

regressor:
  set-regressor:
    features: [[24, 32], [32, 24]]
    n_models: 4
    activation: celu

device: cuda
plot_per_epoch: 8

training:
  n0: 4096
  n_increment: 2048
  batch: 128
  eval_batch: 4096
  warmup_epochs: 16
  patience: 16
  budget: 524288
  iteration_limit: 262144
  val_fraction: 0.25
  loss_precision: 2.0e-2
  cosine_epochs: 16
  cosine_peak: 4.0
  optimizer:
    adamw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      normalised-invariant-rbf:
        exchangeable: 5
  ei:
    n_restarts: 32
    n_steps: 100

verify:
  epochs: 128
  warmup_epochs: 16
  val_every_epochs: 10
  budget: null
  batch: null
