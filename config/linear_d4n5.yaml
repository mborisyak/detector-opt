# CAMPAIGN CONFIG -- `linear` at 4 dimensions / 5 probes / sigma 0.7 (detector:
# config/detector/linear_d4n5.yaml). CPU ONLY: this task's events are analytic and it runs beside the
# GPU campaigns, which must not be disturbed.
#
# BUDGET ARITHMETIC, because it does not follow the enzyme rule and the deviation is deliberate. The
# profile's own selection is the 10 -> 20 doubling pair, so a run must reach 20 designs. With `n0` =
# `iteration_limit` (no growth, below) each design spends n0 / (1 - val_fraction) = 349525 calls, so 20
# designs need 6990506. `budget` 8388608 (2^23) gives 24. The enzyme configs' `iteration_limit =
# budget / 4` CANNOT hold here -- it would leave 3 designs -- so `iteration_limit` is set from the
# window a design actually needs and the budget from the design count the criterion requires.
#
# NO GROWTH (`n0` = `n_increment` = `iteration_limit`), MEASURED: starting at the full window converged
# 18/18 designs in 11-12 epochs at 46.3 s median with max slack 0.00922, while growing from 16384 took
# 31-56 epochs and its `err` term alone at that window is 0.0113. Growth exists to avoid simulating
# events that are not needed; `linear`'s events are analytic, so it buys nothing here.
#
# `loss_precision` 7.5e-3 is MEASURED on this detector, not carried: `scripts/probe_precision.py` over
# 10 designs x 2 seeds (`output/screen/precision-linear-d4n5.json`) -- the exact optimum, six landscape
# order statistics, three extra ranks at the good end and the uninformative top corner. All 20 cells
# converged, none hit the window cap, and the MAXIMUM slack was 0.00502 at `corner-high`. 7.5e-3 is
# 1.5x that maximum, the headroom covering seeds not measured. The choice of headroom is not
# outcome-determining: criterion (d)'s bar is 10x, i.e. 0.075 here, and the exact-scorer improvement at
# this cell was +0.1006, which clears any headroom between 1.0x and 2.0x the measured maximum.
#
# `bo.gp.kernel.exchangeable` is 5 = `n_probes`: the design record is one field per axis, each 5 wide,
# so the kernel finds 4 blocks permuted TOGETHER and reads the design as a set of probes.

detector: linear_d4n5

regressor:
  set-regressor:
    features: [[16, 8], [8, 16]]
    n_models: 4
    dropconnect: 0.1

device: cpu
plot_per_epoch: false

training:
  n0: 262144
  n_increment: 262144
  batch: 64
  eval_batch: 1024
  warmup_epochs: 2
  patience: 16
  budget: 8388608
  iteration_limit: 262144
  val_fraction: 0.25
  loss_precision: 7.5e-3
  param_mix: 0.25
  optimizer:
    adamaxw:
      learning_rate: 2.5e-4
      b1: 0.9
      b2: 0.999
      eps: 1.0e-8
      weight_decay: 1.0e-3

bo:
  n_init: 5
  gp:
    n_folds: 5
    n_restarts: 5
    n_steps: 40
    log_lengthscale_prior_bounds: [-2.0, 1.0]
    log_amplitude_prior_bounds: [-6.0, 1.5]
    kernel:
      normalised-invariant-rbf:
        exchangeable: 5
  ei:
    n_restarts: 32
    n_steps: 100

verify:
  n_points: 10
  epochs: 200
  val_every_epochs: 10
  budget: null
  batch: null
